<style>
/* Layout: app shell — sticky top bar, one working column (max 1120px), screens swap in place. */
:root {
  --bg: #F3F5F2;
  --surface: #ffffff;
  --sunken: #F7F9F7;
  --ink: #262A27;
  --muted: #6B6B6B;
  --line: #E2E7E2;
  --brand: #5F7A61;
  --brand-dk: #475C4A;
  --brand-soft: #E9F0E9;
  --sched: #c9a227;
  --sched-soft: #f4ead0;
  --actual: #5F7A61;
  --ok: #2E7D4F;
  --ok-soft: #E2F3E8;
  --warn: #B7791F;
  --warn-soft: #FDF1DC;
  --bad: #C0392B;
  --bad-soft: #FBE4E1;
  --info: #2f62a8;
  --info-soft: #e0eaf7;
  --btn: #5F7A61;
  --btn-ink: #ffffff;
  --nonwork: rgba(27, 34, 30, .05);
  --f-display: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 11px;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(40,60,45,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --sunken: #232b26; --ink: #e6ece8; --muted: #9aa69f; --line: #2f3933;
    --brand: #9DBA9F; --brand-dk: #7FA083; --brand-soft: #26332A; --sched: #d9b648; --sched-soft: #3a3320; --actual: #5fb878;
    --ok: #6fcf8f; --ok-soft: #1f3a29; --warn: #f0a050; --warn-soft: #3d2c19; --bad: #f2877c; --bad-soft: #42211e;
    --info: #8db6ee; --info-soft: #1e2d42; --btn: #7FA083; --btn-ink: #10150F; --nonwork: rgba(230, 236, 232, .05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --sunken: #232b26; --ink: #e6ece8; --muted: #9aa69f; --line: #2f3933;
  --brand: #9DBA9F; --brand-dk: #7FA083; --brand-soft: #26332A; --sched: #d9b648; --sched-soft: #3a3320; --actual: #5fb878;
  --ok: #6fcf8f; --ok-soft: #1f3a29; --warn: #f0a050; --warn-soft: #3d2c19; --bad: #f2877c; --bad-soft: #42211e;
  --info: #8db6ee; --info-soft: #1e2d42; --btn: #7FA083; --btn-ink: #10150F; --nonwork: rgba(230, 236, 232, .05);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { display: flex; align-items: center; gap: 12px; min-height: 54px; }
.wordmark { font-family: var(--f-display); font-weight: 700; font-stretch: 100%; letter-spacing: .02em; font-size: 1.05rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.wordmark b { color: var(--brand); font-weight: 700; }
.topbar .sep { width: 1px; height: 20px; background: var(--line); }
.topbar .ctx { font-size: .9rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.topbar .who img { width: 26px; height: 26px; border-radius: 50%; }
.topbar .who .who-txt { display: grid; line-height: 1.2; min-width: 0; }
.topbar .who b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.topbar .who small { font-size: .75rem; overflow: hidden; text-overflow: ellipsis; }

.wrap { padding-block: 14px 96px; display: grid; gap: 22px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head > div { display: grid; gap: 6px; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: .9rem; justify-self: start; }
.back:hover { color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 550; font-size: .92rem; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font-weight: 550; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.section { display: grid; gap: 14px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.idle { background: var(--sunken); color: var(--muted); }

.notice { padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: .9rem; }
.notice.info { background: var(--info-soft); }

/* Home */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-display); font-stretch: 85%; font-size: 1.9rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pcard { padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; transition: border-color .15s; }
.pcard:hover { border-color: var(--muted); }
.pcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pcard .code { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.pcard .meta { font-size: .88rem; color: var(--muted); }
.pcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

.meter { position: relative; height: 10px; border-radius: 5px; background: var(--sunken); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--actual); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--sched); border-radius: 1px; }
.meter-legend { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--muted); }
.meter-legend b { color: var(--ink); font-weight: 600; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.key.a { background: var(--actual); }
.key.s { background: var(--sched); }

.empty { padding: 36px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty p { max-width: 46ch; color: var(--muted); }

/* Project */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-stretch: 85%; font-size: 1.7rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: .82rem; color: var(--muted); }
.chartcard { padding: 16px; display: grid; gap: 10px; }
.chartcard svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }

.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.gantt { --dw: 26px; --lab: 280px; min-width: max-content; font-size: .84rem; }
.g-row { display: flex; border-bottom: 1px solid var(--line); min-height: 34px; }
.g-row:last-child { border-bottom: 0; }
.g-lab { position: sticky; left: 0; z-index: 2; width: var(--lab); flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.g-track { position: relative; width: calc(var(--n) * var(--dw)); flex: none; background-image: repeating-linear-gradient(to right, transparent 0 calc(var(--dw) - 1px), var(--line) calc(var(--dw) - 1px) var(--dw)); }

.g-bar.a.open { background: repeating-linear-gradient(-45deg, var(--actual) 0 5px, transparent 5px 8px); border: 1px solid var(--actual); }
.g-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--info); opacity: .7; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }

/* Editor */

.input, textarea.input, select.input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
textarea.input { resize: vertical; min-height: 64px; line-height: 1.45; }
.input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.phase-block { display: grid; }
.phase-title { padding: 10px 16px; font-size: .76rem; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line); }
.phase-block:first-child .phase-title { border-radius: 10px 10px 0 0; }

.act-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-width: 44px; min-height: 36px; font-family: var(--f-mono); font-size: .8rem; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--btn); color: var(--btn-ink); }
.pct-in { width: 76px; min-height: 36px; text-align: right; font-family: var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.act .was { font-size: .78rem; color: var(--muted); }
.done-list { padding: 12px 16px; font-size: .84rem; color: var(--muted); line-height: 1.6; }
.done-list b { color: var(--ink); font-weight: 550; }
.toggle-done { padding: 10px 16px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--brand); cursor: pointer; font-weight: 550; font-size: .88rem; }

.sumgrid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.sumbox { display: grid; gap: 10px; align-content: start; }
.bigpair { display: flex; gap: 22px; flex-wrap: wrap; }

.crew { padding: 6px 16px; display: grid; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.stepper input { width: 48px; text-align: center; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 38px; font-family: var(--f-mono); background: var(--surface); }

.photos { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.ph { display: grid; gap: 8px; align-content: start; }
.ph .img { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--sunken); display: grid; place-items: center; color: var(--muted); font-size: .82rem; position: relative; }

.drop:hover, .drop.over { border-color: var(--brand); color: var(--brand); }

.bar-actions { position: sticky; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); margin-top: -1px; }
.bar-actions .in { max-width: 1120px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar-actions .status { font-size: .84rem; color: var(--muted); margin-right: auto; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; }

/* Report sheet */
.sheet { padding: clamp(18px, 4vw, 40px); display: grid; gap: 26px; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }

.rinfo { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 24px; font-size: .92rem; }
.rinfo div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.rinfo dt { width: 104px; flex: none; color: var(--muted); }

.sheet .sec { display: grid; gap: 12px; }

/* Plan editor */

.plan-foot { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; color: var(--muted); flex: none; }

.wd { display: flex; flex-wrap: wrap; gap: 6px; }

.g-nw.hol, .g-day.hol { background: var(--bad-soft); }

.av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: .7rem; font-weight: 700; flex: none; object-fit: cover; }

.eng { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; line-height: 1.25; }
.picker { display: grid; gap: 6px; }
.picker-results { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.picker-results button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.picker-results button:last-child { border-bottom: 0; }
.picker-results button:hover, .picker-results button.on { background: var(--brand-soft); }
.lockbar { padding: 12px 16px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.g-bar.r { top: 26px; height: 4px; background: var(--muted); opacity: .45; }
.g-day.pick { cursor: pointer; }
.g-day.pick:hover { outline: 2px solid var(--brand); outline-offset: -2px; }
.g-day.xw { box-shadow: inset 0 -3px 0 var(--ok); }
.seg-filter { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg-filter button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; font-size: .86rem; }
.seg-filter button.on { background: var(--btn); color: var(--btn-ink); }
.warnlist { display: grid; gap: 6px; }
.warnlist .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .88rem; }
fieldset.locked { opacity: .6; pointer-events: none; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 22px; }
.cal { padding: 16px; display: grid; gap: 16px; }
.calm-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 18px 22px; }
.calm h3 { font-size: .95rem; margin-bottom: 6px; }
.calm-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.calm-grid .dh { font-size: .66rem; color: var(--muted); text-align: center; letter-spacing: .03em; }
.cd { position: relative; aspect-ratio: 1; min-height: 38px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; display: grid; place-items: center; font-size: .82rem; }
.cd b { font-family: var(--f-mono); font-weight: 500; }
.cd:hover { outline: 2px solid var(--brand); outline-offset: -2px; }
.cd.off { background: var(--sunken); color: var(--muted); border-color: transparent; }
.cd.hol { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.cd.xw { border: 2px solid var(--ok); color: var(--ink); }
.g-bar.s.none { background: transparent; border: 1px dashed var(--sched); }
.cd.xo { background: repeating-linear-gradient(-45deg, var(--sunken) 0 4px, var(--bad-soft) 4px 8px); color: var(--muted); border-color: transparent; }
.cd i, .cd-n { position: absolute; top: 2px; right: 2px; font-style: normal; font-size: .58rem; line-height: 1; padding: 2px 3px; border-radius: 4px; background: var(--sched-soft); color: var(--ink); font-family: var(--f-mono); }
.cd-n { position: static; display: inline-block; margin-right: 4px; }

.g-day.xo { background: repeating-linear-gradient(-45deg, var(--sunken) 0 4px, var(--bad-soft) 4px 8px); }
.act-sum { padding: 14px 16px; cursor: pointer; }
details.card[open] .act-sum { border-bottom: 1px solid var(--line); }
.rowbtns { display: flex; gap: 6px; }
.tt-img { overflow-x: auto; border-radius: 4px; background: #fff; }
.tt-img img { display: block; max-width: none; width: max(100%, 720px); height: auto; }
.sumtbl th { background: #5F7A61; color: #fff; text-align: center; }
.cd.sc::after { content: ""; position: absolute; inset: 3px; border: 2px solid var(--brand); border-radius: 50%; pointer-events: none; }
.export-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.undo-row { display: flex; gap: 6px; }
.st-inline, .m-only { display: none; }
@media (max-width: 640px) { .st-inline { display: inline-flex; margin-left: 6px; } .m-only { display: inline; } .tbl.stack td.st-col { display: none; } }
.dates { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .84rem; }
.dchip button { border: 0; background: none; cursor: pointer; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; }
.dchip button:hover { background: var(--sunken); color: var(--ink); }
.slot-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.photos.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sheet .photos.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ph .cap-count { font-size: .74rem; color: var(--muted); justify-self: end; }
.due { padding: 14px 16px; display: grid; gap: 10px; }
.due-list { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.due-item { display: inline-flex; align-items: center; gap: 8px; }
.due-item .linkbtn, .due .linkbtn { font-size: .82rem; }
.tbl tr.phase-row td { background: var(--sunken); font-size: .74rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-block: 7px; }
.hol-year { display: grid; gap: 8px; }
@media (max-width: 560px) { .photos.four, .sheet .photos.four { grid-template-columns: 1fr; } }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 12, .86); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 6px; }

.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.pv-title { display: grid; flex: 1 1 220px; min-width: 0; }
.pv-title span { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-status { font-size: .82rem; }
.pv-pages { overflow: auto; padding: 16px 8px 32px; display: grid; justify-items: center; align-content: start; gap: 14px; }
.pv-tip { flex-basis: 100%; font-size: .8rem; margin: 0; }
.xl-import { padding: 12px 16px; display: grid; gap: 6px; font-size: .9rem; }
.xl-import .muted { font-size: .82rem; }
.pv-pages img { display: block; background: #fff; max-width: min(1100px, 100%); height: auto; border-radius: 2px; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
.pv-pages canvas { display: block; background: #fff; max-width: 100%; height: auto; border-radius: 2px; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
.lightbox p { color: #f1f4f2; text-align: center; max-width: 70ch; margin-top: 10px; font-size: .92rem; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: var(--r); font-size: .9rem; max-width: calc(100% - 32px); }

@media (max-width: 720px) {

}
/* Phones */
@media (max-width: 640px) {
  .wrap { padding-block: 14px 120px; gap: 18px; }
  .input, textarea.input, select.input, .pct-in, .stepper input { font-size: 16px; }
  .page-head .actions { width: 100%; }
  .page-head .actions .btn { flex: 1 1 auto; }
  .stats, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat .v, .kpi .v { font-size: 1.5rem; }
  .plist { grid-template-columns: 1fr; }
  .bar-actions .in { gap: 8px; }
  .bar-actions .status { flex-basis: 100%; margin-right: 0; }
  .bar-actions .in > .btn { flex: 1 1 0; padding: 0 10px; }
  .bar-actions .confirm { flex-basis: 100%; }
  .act { padding: 12px; }
  .pct-ctl { width: 100%; }
  .seg { flex: 1 1 auto; }
  .seg button { flex: 1 1 0; min-width: 0; }
  .sheet { padding: 16px; gap: 20px; }
  .sheet-head .co { display: none; }
  .rinfo dt { width: 96px; }
  .tbl.stack thead { display: none; }
  .tbl.stack, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td { display: block; width: 100%; }
  .tbl.stack tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .tbl.stack tr:last-child { border-bottom: 0; }

  .tbl.stack td[data-l]::before { content: attr(data-l) "  "; color: var(--muted); font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; margin-right: 6px; }
  .tbl.stack tr.phase-row { padding: 0; }
  .tbl.stack tr.phase-row td { padding: 8px 14px; }
  .lockbar { padding: 12px; }
  .seg-filter { width: 100%; }
  .seg-filter button { flex: 1 1 0; }
  .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* ---------- Forwardlog portal style (same look as SortCheck: forwardlog-portal skill) ---------- */

#fl-signout { background: var(--brand-soft) !important; color: var(--brand-dk) !important; border: 0 !important; border-radius: 10px !important; padding: 7px 11px !important; font-weight: 700 !important; }
.card, .gantt-wrap { border-radius: var(--radius); box-shadow: var(--shadow); }
.btn { min-height: 44px; border-radius: var(--r); font-weight: 700; border-color: #CBD3CB; }

.btn.primary:hover { opacity: 1; background: var(--brand-dk); border-color: var(--brand-dk); }

  function banner(msg) {
    const b = document.createElement("div");
    b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:50;padding:12px 16px;background:#b42318;color:#fff;font:14px/1.4 system-ui,sans-serif;text-align:center";
    b.textContent = msg; document.body.appendChild(b);
  }
  /* Speed: the records from the last visit are kept on this device and shown at once;
     the full, fresh copy is loaded from the Sheet straight after and replaces them. Saving waits for the fresh copy. */
  const CACHE_KEY = "fl_prog_cache_v1";
  let live = null, me = null;
  const saveCache = () => {
    try {
      const changes = [];
      Object.keys(store).forEach((c) => store[c].forEach((data, id) => changes.push({ c, id, data })));
      const s = JSON.stringify({ email: me && me.email, me, version: since, changes });
      if (s.length < 3500000) ls.set(CACHE_KEY, s); else ls.del(CACHE_KEY);
    } catch (e) { ls.del(CACHE_KEY); }
  };
  function start() {
    if (ready) return ready;
    live = run("bootstrap").then((r) => {
      Object.keys(store).forEach((c) => store[c].clear());
      since = r.version; apply(r.changes); me = r.me; saveCache();
      setInterval(pollNow, 20000);
      addSignOut(); new MutationObserver(addSignOut).observe(document.body, { childList: true, subtree: true });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) pollNow(); });
      return r;
    });
    let cached = null;
    try { cached = JSON.parse(ls.get(CACHE_KEY) || "null"); } catch (e) { cached = null; }
    const tok = saved();
    if (cached && tok && cached.email && cached.email === tok.email && cached.me) {
      apply(cached.changes); since = cached.version || 0; me = cached.me;
      ready = Promise.resolve({ me: cached.me, version: since, changes: [] });
      live.then(() => subs.forEach(fire)).catch((e) => banner("Couldn't refresh from the server: " + (e.message || "unknown error") + " What you see may be out of date. Reload the page to try again."));
    } else {
      ready = live.catch((e) => { banner("The portal couldn't load: " + (e.message || "unknown error") + " Reload the page to try again."); throw e; });
    }
    return ready;
  }
  const fresh = () => start().then(() => live);
  async function pollNow() {
    if (polling || document.hidden) return;
    polling = true;
    try { const r = await run("poll", since); since = r.version; if (apply(r.changes)) { subs.forEach(fire); saveCache(); } } catch (e) { /* try again next round */ }
    polling = false;
  }
  /* ---- submit password: asked when a report goes from draft to submitted; remembered for this tab ---- */
  const PW_KEY = "fl_prog_pw";
  const ss = { get: () => { try { return sessionStorage.getItem(PW_KEY); } catch (e) { return null; } },
               set: (v) => { try { sessionStorage.setItem(PW_KEY, v); } catch (e) {} },
               del: () => { try { sessionStorage.removeItem(PW_KEY); } catch (e) {} } };
  function askPassword(msg) {
    return new Promise((resolve) => {
      const m = document.createElement("div");
      m.style.cssText = "position:fixed;inset:0;z-index:110;background:rgba(20,28,22,.45);display:flex;align-items:center;justify-content:center;padding:20px;font:15px/1.5 Montserrat,Archivo,system-ui,sans-serif;color:#262A27";
      m.innerHTML = '<form style="background:#fff;border-radius:14px;border-top:4px solid #5F7A61;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:22px 20px;max-width:360px;width:100%">' +
        '<div style="font-size:10px;font-weight:800;letter-spacing:1.6px;color:#5F7A61;text-transform:uppercase">Submit report</div>' +
        '<h2 style="margin:4px 0 6px;font-size:18px">Enter the submit password</h2>' +
        '<p style="margin:0 0 12px;color:#6B6B6B;font-size:13px">Ask your project manager if you don\'t have it. It is remembered until you close this tab.</p>' +
        '<input type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #CBD3CB;border-radius:11px">' +
        '<p class="pw-msg" style="margin:8px 0 0;color:#C0392B;font-size:13px;font-weight:600;min-height:1em"></p>' +
        '<div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="pw-cancel" style="flex:1;min-height:44px;border:0;border-radius:11px;background:#EDF1ED;font:inherit;font-weight:700;color:#262A27">Cancel</button>' +
        '<button type="submit" style="flex:1;min-height:44px;border:0;border-radius:11px;background:#5F7A61;color:#fff;font:inherit;font-weight:700">Submit</button></div></form>';
      document.body.appendChild(m);
      const f = m.querySelector("form"), inp = m.querySelector("input");
      m.querySelector(".pw-msg").textContent = msg || "";
      const done = (v) => { m.remove(); resolve(v); };
      m.querySelector(".pw-cancel").onclick = () => done(null);
      f.onsubmit = (e) => { e.preventDefault(); done(inp.value); };
      setTimeout(() => inp.focus(), 30);
    });
  }
  const needsPassword = (c, id, data) => c === "reports" && data && data.status === "submitted" && !(store[c].get(id) && store[c].get(id).status === "submitted");
  async function saveDoc(c, id, data) {
    if (!needsPassword(c, id, data)) return run("setDoc", c, id, JSON.stringify(data));
    // Try first with the remembered password (or none); only ask if the server says one is needed.
    let pw = ss.get(), msg = "";
    for (let i = 0; i < 4; i++) {
      if (!pw && i > 0) { pw = await askPassword(msg); if (pw === null) throw { code: "cancelled", message: "Submission cancelled: the report is still a draft." }; }
      try { const v = await run("setDoc", c, id, JSON.stringify(data), pw); if (pw) ss.set(pw); return v; }
      catch (e) {
        const m = String((e && e.message) || "");
        if (/PASSWORD_(WRONG|REQUIRED)/.test(m)) { ss.del(); msg = pw ? "That password is not correct. Try again." : ""; pw = null; continue; }
        if (/PASSWORD_LOCKED/.test(m)) ss.del();
        throw e;
      }
    }
    throw { code: "invalid_argument", message: "Wrong submit password. The report is still a draft." };
  }
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  const docRef = (c, id) => ({
    id, path: c + "/" + id,
    get: async () => { await start(); return snapDoc(c, id); },
    set: async (data) => { await fresh(); await saveDoc(c, id, data); store[c].set(id, clone(data)); fireFor(c, id); },
    update: async (data) => { await fresh(); const cur = store[c].get(id); if (!cur) throw { code: "invalid_argument", message: "Record not found" }; const next = Object.assign(clone(cur), data); await saveDoc(c, id, next); store[c].set(id, next); fireFor(c, id); },
    delete: async () => { await fresh(); await run("deleteDoc", c, id); store[c].delete(id); fireFor(c, id); },
    onSnapshot: (cb, err) => { const s = { c, id, cb }; subs.add(s); start().then(() => fire(s)).catch((e) => err && err(e)); return () => subs.delete(s); },
    collection: () => { throw new TypeError("Sub-collections aren't used by this portal"); }
  });
  const collRef = (c) => {
    if (!store[c]) throw new TypeError("Unknown collection " + c);
    return {
      path: c,
      doc: (id) => docRef(c, id || newId()),
      add: async (data) => { const ref = docRef(c, newId()); await ref.set(data); return ref; },
      get: async () => { await start(); return snapColl(c); },
      onSnapshot: (cb, err) => { const s = { coll: c, cb }; subs.add(s); start().then(() => fire(s)).catch((e) => err && err(e)); return () => subs.delete(s); }
    };
  };
  const db = Object.freeze({
    collection: (path) => collRef(path),
    doc: (path) => { const [c, id] = String(path).split("/"); if (!store[c] || !id) throw new TypeError("Bad path " + path); return docRef(c, id); }
  });

  /* ---- who is signed in: Google account email; managers come from the Managers tab ---- */
  const nice = (email) => String(email || "").split("@")[0].split(/[._-]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");
  const avatarFor = (name) => {
    const ini = (String(name).match(/\b\w/g) || ["?"]).slice(0, 2).join("").toUpperCase();
    return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="20" fill="#e1ece4"/><text x="20" y="25" font-size="14" text-anchor="middle" fill="#3f6b4c" font-family="Arial" font-weight="700">${ini}</text></svg>`);
  };
  const profile = (id) => ({ id, name: /@/.test(id) ? nice(id) : "", avatarUrl: avatarFor(nice(id)), color: "#3f6b4c", email: /@/.test(id) ? id : null, isMe: false, guest: false });
  const user = Object.freeze({
    me: async () => { const r = await start(); const name = r.me.name || nice(r.me.email); return { id: r.me.email, name, avatarUrl: avatarFor(name), color: "#3f6b4c", email: r.me.email, isOwner: false, canEdit: !!r.me.isManager }; },
    id: async () => (await start()).me.email,
    name: async () => nice((await start()).me.email),
    email: async () => (await start()).me.email,
    isOwner: async () => false,
    canEdit: async () => !!(await start()).me.isManager,
    can: async (n) => (n === "data.write" || n === "assets.write" ? true : n === "files.write" ? !!(await start()).me.isManager : false),
    profiles: async (ids) => Object.fromEntries([].concat(ids || []).map((id) => [id, profile(id)])),
    search: async () => []
  });

  /* ---- photos and generated files go to Google Drive ---- */
  const assets = Object.freeze({
    upload: async (blob, opts) => {
      const type = (opts && opts.type) || blob.type || "image/jpeg";
      const r = await run("uploadPhoto", await toB64(blob), type, (opts && opts.folder) || "Unsorted");
      return { id: r.id, url: "", sizeBytes: blob.size, contentType: type };
    },
    list: async () => ({ assets: [], usage: { files: 0, bytes: 0, maxFiles: 0, maxBytes: 0 } }),
    delete: async () => ({ deleted: false })
  });
  const downloads = Object.freeze({
    save: async (req) => {
      const blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
      const r = await run("saveFile", await toB64(blob), req.filename, req.folder || "Unsorted", req.sub || "Exports");
      return { status: "saved", url: r.url };
    }
  });

  const caps = { db, user, assets, downloads };
  window.PORTAL_ENV = Object.freeze({ kind: "github-pages", photo: (id) => run("getPhoto", id), signOut });
  window.claude = Object.freeze({ use: async (name) => caps[name] || null });
})();

</script>

function projReports(pid, submittedOnly) {
  return [...S.reports.values()].filter((r) => r.projectId === pid && (!submittedOnly || r.status === "submitted"))
    .sort((a, b) => (a.date === b.date ? (a.reportNo || 0) - (b.reportNo || 0) : a.date < b.date ? -1 : 1));
}
function latest(pid) { const l = projReports(pid, true); return l[l.length - 1] || null; }
function projDates(p) {
  let s = null, e = null;
  acts(p).forEach((a) => {
    [a.start, a.actualStart].forEach((x) => { if (validDate(x) && (!s || x < s)) s = x; });
    [a.end, a.actualEnd].forEach((x) => { if (validDate(x) && (!e || x > e)) e = x; });
  });
  return { start: s, end: e };
}
function plannedStart(p) { let s = null; acts(p).forEach((a) => { if (validDate(a.start) && (!s || a.start < s)) s = a.start; }); return s; }
function plannedFinish(p) { let e = null; acts(p).forEach((a) => { if (validDate(a.end) && (!e || a.end > e)) e = a.end; }); return e; }
function projSnapshot(p) {
  const r = latest(p.id);
  const asOf = r ? r.date : todayISO();
  const prog = r ? r.progress : {};
  return { r, asOf, actual: projActual(p, prog), sched: projSched(p, asOf) };
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function toastLink(msg, url, label) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg + " ";
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = label || "Open"; a.style.cssText = "color:inherit;font-weight:700;text-decoration:underline";
  t.appendChild(a); document.body.appendChild(t);
  setTimeout(() => t.remove(), 9000);
}
function dbErr(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "The report store is full. Ask the portal owner to remove old drafts.";
  if (c === "invalid_argument") return ENV ? "You don't have permission to change this. Ask a manager." : "You can view reports but not change them. Ask the portal owner for Contributor access.";
  if (c === "resource_exhausted") return "Too many saves at once. Wait a few seconds and try again.";
  return "Couldn't save. Check your connection and try again.";
}

/* ---------- names ---------- */
let nameTimer = null;
function nameOf(id) {
  if (!id) return "—";
  if (S.names[id] !== undefined) return S.names[id] || "Team member";
  S.names[id] = undefined;
  clearTimeout(nameTimer); nameTimer = setTimeout(resolveNames, 30);
  return "…";
}
async function resolveNames() {
  if (!S.user) return;
  const ids = new Set();
  S.reports.forEach((r) => { if (r.authorId) ids.add(r.authorId); });
  S.projects.forEach((p) => {
    [p.createdBy, p.engineerId, p.lockedBy].forEach((x) => x && ids.add(x));
    (p.engineerLog || []).forEach((x) => { x.id && ids.add(x.id); x.by && ids.add(x.by); });
  });
  if (!ids.size) return;
  const ps = await S.user.profiles([...ids]);
  let changed = false;
  for (const id of ids) {
    const n = ps[id]?.name || ""; if (S.names[id] !== n) { S.names[id] = n; changed = true; }
    if (ps[id]?.avatarUrl && S.avatars[id] !== ps[id].avatarUrl) { S.avatars[id] = ps[id].avatarUrl; changed = true; }
  }
  if (changed && S.view !== "edit" && S.view !== "plan") render();
}

/* ---------- writes (one at a time per doc) ---------- */
const queues = new Map();
function write(path, data) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(() => S.db.doc(path).set(data));
  queues.set(path, next);
  return next;
}

/* ---------- render ---------- */
function setCtx(t) { $("#ctx").textContent = t; }
function render() {
  const app = $("#app");
  $("#bar").innerHTML = "";
  if (S.view === "home") app.innerHTML = viewHome();
  else if (S.view === "project") app.innerHTML = viewProject();
  else if (S.view === "report") { app.innerHTML = viewReport(); fillTimetableImg(); }
  else if (S.view === "holidays") app.innerHTML = viewHolidays();
  else if (S.view === "edit") { app.innerHTML = viewEditor(); $("#bar").innerHTML = editorBar(); updateEditorSummary(); }
  else if (S.view === "plan") { app.innerHTML = viewPlan(); $("#bar").innerHTML = planBar(); }
  wireImages(app);
}
function go(view, opts = {}) {
  if (view === "plan" && S.view !== "plan" && S.plan) S.planSnap = JSON.stringify(S.plan);
  S.view = view;
  if ("pid" in opts) S.pid = opts.pid;
  if ("rid" in opts) S.rid = opts.rid;
  S.confirm = null;
  render();
  window.scrollTo(0, 0);
  navRecord();
}
function wireImages(root) {
  root.querySelectorAll("img[data-blob]").forEach((img) => {
    const fail = () => { const box = img.parentElement; if (!box) return; img.remove(); box.insertAdjacentHTML("afterbegin", "<span>Photo unavailable</span>"); };
    img.addEventListener("error", fail, { once: true });
    if (!img.getAttribute("src") && img.dataset.id) photoSrc(img.dataset.id).then((s) => { img.src = s; }).catch(fail);
  });
}
function writeAllowed() { return S.db && S.canWrite !== false; }

function headerBlock(eyebrow, title, actions = "", back = "") {
  return `<div class="page-head"><div>${back}<p class="eyebrow">${eyebrow}</p>${title ? `<h1>${title}</h1>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
}
function meter(actual, sched) {
  return `<div class="meter" role="img" aria-label="Actual ${pct(actual)}, scheduled ${pct(sched)}"><div class="fill" style="width:${Math.min(100, actual * 100)}%"></div><div class="tick" style="left:${Math.min(100, sched * 100)}%"></div></div>`;
}

/* Home */
function viewHome() {
  setCtx("Progress reports");

  let out = headerBlock("Forwardlog Automation · Project engineering", "", `<button class="btn" data-a="holidays">Public holidays</button>` + actions);
  if (S.noDb) {
    out += `<div class="notice">${ENV ? "The portal couldn't reach its data. Check your connection and reload the page." : "Projects and reports live in this page's shared store, which isn't available in this view. Open the page on claude.ai while signed in to your Forwardlog account."}</div>`;
  }
  if (S.canWrite === false) {
    out += `<div class="notice info">You have view access. To file reports, ask the portal owner to make you a Contributor.</div>`;
  }
  if (!S.loaded.projects && !S.noDb) return out + `<div class="card empty"><h2>Loading projects…</h2></div>`;
  const active = [...S.projects.values()].filter((p) => !p.archived);
  const myName = (S.me?.name || "").trim().toLowerCase();
  const mineAll = myName ? active.filter((p) => (engineerOn(p, todayISO()) || "").toLowerCase() === myName) : [];
  if (S.filter === null) S.filter = mineAll.length && !isMgr() ? "mine" : "all";
  const list = (S.filter === "mine" ? mineAll : active).sort((a, b) => {
    const da = reportDue(a), db = reportDue(b);
    const ka = (da.dueToday || da.missing.length ? 0 : 1), kb = (db.dueToday || db.missing.length ? 0 : 1);
    return ka - kb || (a.code || "").localeCompare(b.code || "");
  });
  const archived = [...S.projects.values()].filter((p) => p.archived);

  const snaps = list.map((p) => ({ p, ...projSnapshot(p) }));

  const dueNow = list.filter((p) => reportDue(p).dueToday).length;
  out += `<div class="stats">

    <div class="card stat"><span class="eyebrow">Behind schedule</span><span class="v" style="color:${behind ? "var(--bad)" : "inherit"}">${behind}</span></div>

  if (S.me?.id && active.length) out += `<div class="section-head"><div class="seg-filter" role="group" aria-label="Which projects"><button data-a="filter" data-v="mine" class="${S.filter === "mine" ? "on" : ""}">My projects (${mineAll.length})</button><button data-a="filter" data-v="all" class="${S.filter === "all" ? "on" : ""}">All projects (${active.length})</button></div><span class="muted">Projects with reports due are listed first.</span></div>`;
  if (!list.length) {
    out += S.filter === "mine" && active.length
      ? `<div class="card empty"><h2>No projects assigned to you</h2><p>A manager assigns each project to one engineer. You can still write reports on any project from All projects.</p></div>`
      : `<div class="card empty"><h2>No projects yet</h2><p>${isMgr() ? "Create a project, import the converted timetable, set the working days and lock the schedule. Engineers then file a report every work day." : "A manager sets up each project. Once its schedule is locked, it appears here for daily reports."}</p>${actions}</div>`;
  } else {
    out += `<div class="plist">${snaps.map(({ p, r, actual, sched, asOf }) => {
      const v = variance(actual, sched);
      return `<div class="card pcard" data-a="open-project" data-id="${esc(p.id)}" tabindex="0" role="button">

        ${engineerChip(p, todayISO())}
        <div style="display:grid;gap:6px">${meter(actual, sched)}
          <div class="meter-legend"><span><span class="key a"></span>Actual <b class="num">${pct(actual)}</b></span><span><span class="key s"></span>Scheduled <b class="num">${pct(sched)}</b></span></div></div>

      const { start } = projDates(x); const fin = plannedFinish(x);

    <div class="card kpi"><span class="eyebrow">Actual</span><span class="v" style="color:var(--actual)">${pct(actual)}</span><span class="s">${r ? "Report No. " + repNo(r.reportNo) + ", " + fmtShort(r.date) : "No reports yet"}</span></div>
    <div class="card kpi"><span class="eyebrow">Scheduled</span><span class="v">${pct(sched)}</span><span class="s">Plan as of ${fmtShort(asOf)}</span></div>

    <div class="card kpi"><span class="eyebrow">Planned finish</span><span class="v" style="font-size:1.35rem">${fmtD(fin)}</span><span class="s">${fin && fin >= todayISO() ? left + " work days left" : fin ? "Past planned finish" : "Set dates in the plan"}</span></div>
  </div>`;
  const prevKey = prevRevision(p) ? `<span><span class="key" style="background:var(--muted);opacity:.5"></span>Rev. ${prevRevision(p).rev} plan</span>` : "";
  out += `<div class="card chartcard"><div class="section-head"><h2>Progress curve</h2><div class="legend"><span><span class="key s"></span>Scheduled (from plan)</span><span><span class="key a"></span>Actual (from reports)</span>${prevKey}</div></div>${sCurve(p)}</div>`;
  out += `<div class="section"><div class="section-head"><h2>Timeline</h2><div class="export-row"><span class="muted" style="font-size:.85rem">Export:</span><button class="btn small" data-a="tt-export" data-fmt="png">PNG</button><button class="btn small" data-a="tt-export" data-fmt="pdf">PDF</button><button class="btn small" data-a="tt-export" data-fmt="xlsx">Excel</button></div></div><div class="section-head" style="margin-top:-8px"><span></span><div class="legend"><span><span class="key s"></span>Planned</span><span><span class="key a"></span>Actual</span>${prevKey}<span><span class="key" style="background:var(--info)"></span>Latest report</span><span><span class="key" style="background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)"></span>Public holiday</span></div></div>${gantt(p, asOf, r ? r.progress : {}, { prev: prevRevision(p) })}</div>`;
  out += `<div class="section"><div class="section-head"><h2>Reports</h2><span class="muted">${reps.length} total</span></div>`;
  if (!reps.length) out += `<div class="card empty"><p>No reports filed yet. The first report starts from 0% on every activity.</p>${writeAllowed() ? `<button class="btn primary" data-a="new-report" data-id="${esc(p.id)}">Write the first report</button>` : ""}</div>`;
  else out += `<div class="table-wrap"><table class="tbl stack"><thead><tr><th>No.</th><th>Date</th><th class="r">Actual</th><th class="r">Scheduled</th><th>Variance</th><th>Prepared by</th><th>Status</th></tr></thead><tbody>${reps.map((x) => {
    const xv = variance(x.actualPct || 0, x.scheduledPct || 0);
    return `<tr class="click" data-a="open-report" data-id="${esc(x.id)}"><td class="mono">${repNo(x.reportNo)}<span class="m-only" style="font-weight:600"> · ${fmtD(x.date)}</span></td><td style="white-space:nowrap" class="st-col">${fmtD(x.date)}</td><td class="r num" data-l="Actual">${pct(x.actualPct)}</td><td class="r num" data-l="Scheduled">${pct(x.scheduledPct)}</td><td><span class="chip ${xv.cls}">${xv.label}</span></td><td data-l="By">${esc(preparedBy(p, x))}</td><td>${x.status === "draft" ? `<span class="chip warn">Draft</span>` : `<span class="chip ok">Submitted</span>`}</td></tr>`;
  }).join("")}</tbody></table></div>`;
  out += `</div>`;
  return out;
}

function sCurve(p) {
  const { start, end } = projDates(p);
  const fin = plannedFinish(p);
  if (!start || !fin) return `<p class="muted">Add planned dates to activities to see the curve.</p>`;
  const reps = projReports(p.id, true);
  let last = fin;
  reps.forEach((r) => { if (r.date > last) last = r.date; });
  if (end && end > last) last = end;
  const n = Math.max(1, daysBetween(start, last));
  const W = 720, H = 230, L = 40, R = 14, T = 12, B = 30;
  const x = (d) => L + (daysBetween(start, d) / n) * (W - L - R);
  const y = (f) => T + (1 - f) * (H - T - B);
  let grid = "";
  [0, .25, .5, .75, 1].forEach((f) => { grid += `<line x1="${L}" x2="${W - R}" y1="${y(f)}" y2="${y(f)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(f) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${f * 100}</text>`; });
  const step = n > 120 ? 28 : n > 50 ? 14 : 7;
  for (let i = 0; i <= n; i += step) { const d = addDays(start, i); grid += `<text x="${x(d)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtShort(d)}</text>`; }
  let sp = "";
  for (let i = 0; i <= n; i++) { const d = addDays(start, i); sp += (i ? "L" : "M") + x(d).toFixed(1) + " " + y(projSched(p, d)).toFixed(1); }
  const prev = prevRevision(p);
  let pp = "";
  if (prev) for (let i = 0; i <= n; i++) { const d = addDays(start, i); pp += (i ? "L" : "M") + x(d).toFixed(1) + " " + y(projSched(prev, d)).toFixed(1); }
  if (pp) grid += `<path d="${pp}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4" opacity=".7"/>`;
  const pts = [{ date: start, f: 0 }].concat(reps.filter((r) => r.date >= start).map((r) => ({ date: r.date, f: r.actualPct || 0 })));
  const ap = pts.map((q, i) => (i ? "L" : "M") + x(q.date).toFixed(1) + " " + y(q.f).toFixed(1)).join("");
  const area = pts.length > 1 ? ap + `L${x(pts[pts.length - 1].date).toFixed(1)} ${y(0)}L${x(start).toFixed(1)} ${y(0)}Z` : "";
  const lastPt = pts[pts.length - 1];
  const today = todayISO();
  const tmark = today >= start && today <= last ? `<line x1="${x(today)}" x2="${x(today)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${x(today) + 4}" y="${T + 10}" font-size="10" fill="var(--muted)">Today</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scheduled versus actual progress over time">
    ${grid}${tmark}
    <path d="${sp}" fill="none" stroke="var(--sched)" stroke-width="2" stroke-dasharray="5 4"/>
    ${area ? `<path d="${area}" fill="var(--actual)" opacity=".12"/>` : ""}
    <path d="${ap}" fill="none" stroke="var(--actual)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.slice(1).map((q) => `<circle cx="${x(q.date)}" cy="${y(q.f)}" r="3" fill="var(--actual)"/>`).join("")}
    ${pts.length > 1 ? `<circle cx="${x(lastPt.date)}" cy="${y(lastPt.f)}" r="5" fill="var(--surface)" stroke="var(--actual)" stroke-width="2.5"/><text x="${Math.min(x(lastPt.date) + 8, W - 60)}" y="${y(lastPt.f) - 8}" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${pct(lastPt.f)}</text>` : ""}
  </svg>`;
}

/* Project engineer: one per project; managers assign and transfer, with a dated handover log. */
function pickerHTML(prefix, selected) {
  return `<div class="picker"><input class="input" id="${prefix}-q" data-k="person-q" data-prefix="${prefix}" placeholder="Search by name" autocomplete="off" aria-label="Search for an engineer">
    <div class="picker-results" id="${prefix}-res" ${S.search.length ? "" : "hidden"}>${S.search.map((h) => `<button type="button" data-a="pick-person" data-prefix="${prefix}" data-id="${esc(h.id)}" class="${h.id === selected ? "on" : ""}">${avatar(h.id, 22)}<span>${esc(h.name)}</span></button>`).join("")}</div>
    ${selected ? `<span class="eng">${avatar(selected)}<span>Selected: <strong>${esc(nameOf(selected))}</strong></span></span>` : ""}</div>`;
}
function engineerBlock(p) {
  const t = S.transfer && S.transfer.pid === p.id ? S.transfer : null;

      const w = d <= e && isWork(p, d);

    const why = offReason(p, d);

    const title = why ? fmtD(d) + ": " + why + (pickable ? ". Tap to make it a work day." : "") : xw ? fmtD(d) + ": extra work day" + (pickable ? ". Tap to switch." : "") : HOL.has(d) ? fmtD(d) + ": " + HOL.get(d) + (p.locked ? " (announced after this schedule was locked)" : "") : pickable ? fmtD(d) + ": work day. Tap to make it an off day." : "";
    return `<div class="g-day${grey[i] ? " nw" : ""}${HOL.has(d) && grey[i] ? " hol" : ""}${xw ? " xw" : ""}${(p.extraOff || []).includes(d) ? " xo" : ""}${pickable ? " pick" : ""}${dt.getUTCDate() === 1 && i ? " mo" : ""}"${pickable ? ` data-a="toggle-day" data-d="${d}" role="button" tabindex="0"` : ""}${title ? ` title="${esc(title)}"` : ""}>${first ? MON[dt.getUTCMonth()] : DOW[dt.getUTCDay()][0]}<b>${dt.getUTCDate()}</b></div>`;
  }).join("")}</div></div>`;
  (p.phases || []).forEach((ph) => {
    rows += `<div class="g-row phase"><div class="g-lab"><span class="nm">${esc(ph.name)}</span></div><div class="g-track"></div></div>`;
    (ph.activities || []).forEach((a) => {
      const f = Number(prog?.[a.id]) || 0;

      const pa = prevActs?.get(a.id);

    <div class="card sumgrid"><div class="sumbox"><div class="bigpair"><div><span class="eyebrow">Scheduled</span><span class="v" id="sum-s">—</span></div><div><span class="eyebrow">Actual</span><span class="v" id="sum-a" style="color:var(--actual)">—</span></div></div><div id="sum-m"></div><span id="sum-v"></span></div>

// Match an activity name from Excel to the project's activities (exact, then closest wording).
function matchAct(p, name) {
  const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const n = norm(name); if (!n) return null;
  const list = acts(p); const exact = list.find((a) => norm(a.name) === n); if (exact) return exact;
  const words = new Set(n.split(" ")); let best = null, score = 0;
  list.forEach((a) => { const w = new Set(norm(a.name).split(" ")); const common = [...w].filter((x) => words.has(x)).length; const s = common / Math.max(w.size, words.size); if (s > score) { score = s; best = a; } });
  return score >= 0.6 ? best : null;
}

  const wb = await xml("xl/workbook.xml"); const wbRels = await rels("xl/_rels/workbook.xml.rels");

      const t = c.getAttribute("t"); const vEl = c.getElementsByTagName("v")[0];

      if (v === "") continue;

    }

  };

  const right = (g, at) => { if (!at) return ""; const row = g.get(at.r); if (!row) return ""; const cs = [...row.keys()].filter((c) => c > at.c).sort((a, b) => a - b); return cs.length ? row.get(cs[0]) : ""; };
  const repSheet = sheets.find((s) => /progress\s*report/i.test(s.name)) || sheets[0];
  const g = await gridOf(repSheet.path);

  const dv = right(g, find(g, /^date\s*:?$/i)); out.date = typeof dv === "number" ? cellDate(dv) : "";
  const rn = find(g, /^report\s*no/i); out.reportNo = rn ? (g.get(rn.r + 1)?.get(rn.c) ?? right(g, rn)) : "";

      const box = boxes.filter((b) => b.from.row >= ph.to.row - 1 && b.from.row <= ph.to.row + 6 && Math.abs(b.from.col - ph.from.col) <= 1).sort((a, b) => a.from.row - b.from.row)[0];

      const ext = ph.path.split(".").pop().toLowerCase();
      out.photos.push({ blob: new Blob([await zip.file(ph.path).async("arraybuffer")], { type: ext === "png" ? "image/png" : ext === "gif" ? "image/gif" : ext === "webp" ? "image/webp" : "image/jpeg" }), caption: cap });
    }

// Saving a new draft takes a few seconds on Google; repeat taps meanwhile wait for that draft instead of making more.
const startingReport = new Map();
function newReport(pid, forDate) {
  const key = pid + "|" + (validDate(forDate) ? forDate : todayISO());
  if (startingReport.has(key)) return startingReport.get(key);
  const job = startReport(pid, forDate).finally(() => startingReport.delete(key));
  startingReport.set(key, job);
  return job;
}
async function startReport(pid, forDate) {
  const p = S.projects.get(pid); if (!p || !S.db) return;
  if (!p.locked) { toast("This project's schedule isn't locked yet. A manager needs to finish the setup first."); return; }
  const date = validDate(forDate) ? forDate : todayISO();
  const existing = projReports(pid, false).find((x) => x.date === date);
  if (existing) {
    if (existing.status === "draft") { openEditor(existing.id); toast("Picking up the draft for " + fmtD(date) + "."); }
    else { go("report", { rid: existing.id }); toast("Report No. " + repNo(existing.reportNo) + " for " + fmtD(date) + " is already submitted."); }
    return;
  }
  const all = projReports(pid, false);
  const prev = projReports(pid, true).filter((x) => x.date < date).pop();
  const maxNo = all.reduce((m, x) => Math.max(m, Number(x.reportNo) || 0), 0);
  const ref = S.db.collection("reports").doc();
  const progress = {}; acts(p).forEach((a) => { progress[a.id] = Number(prev?.progress?.[a.id]) || 0; });
  const body = {
    projectId: pid, reportNo: maxNo + 1, date, rev: p.rev || 0, status: "draft", progress, notes: {}, remarks: "", photos: [null, null, null, null], preparedBy: engineerOn(p, date) || "",
    scheduledPct: projSched(p, date), actualPct: projActual(p, progress),
    authorId: S.me?.id || null, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()

/* photos */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1920, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), "image/jpeg", .85));
  } catch { return file; }
}
async function addPhoto(file, slot) {
  if (!file || !S.assets || !S.draft) return;
  if (!/^image\//.test(file.type)) { toast(file.name + " isn't an image."); return; }
  const draft = S.draft;
  S.uploading = { ...(S.uploading || {}), [slot]: true };
  $("#photos").innerHTML = photosHTML();
  try {
    const blob = await shrink(file);
    const type = blob.type && /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : "image/jpeg";
    const res = await S.assets.upload(blob, ENV ? { type, folder: S.projects.get(draft.projectId)?.code || "Unsorted" } : { type });
    draft.photos = slots(draft);
    draft.photos[slot] = { id: res.id, caption: draft.photos[slot]?.caption || "" };
  } catch (e) {
    toast(e?.code === "too_large" ? file.name + " is too large." : e?.code === "unsupported_type" ? file.name + " isn't a supported image type." : e?.code === "quota_or_state" ? "Photo storage is full." : "Couldn't upload " + file.name + ". Try again.");
  }
  delete S.uploading[slot];
  if (S.draft !== draft) return;
  $("#photos").innerHTML = photosHTML(); wireImages($("#photos"));
  touch();
}

// Every export opens here first: the pages as they will look, then Download or Share the same file.
async function openPreview(pv) {
  closePreview();
  S.preview = pv;
  const type = pv.kind === "pdf" ? "PDF" : pv.kind === "png" ? "image" : "Excel file";
  const box = document.createElement("div"); box.className = "pdfprev"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Preview " + pv.name);
  const share = canShareFiles(pv);
  box.innerHTML = `<div class="pv-bar"><div class="pv-title"><b>Preview</b><span class="muted">${esc(pv.name)}</span></div><span class="pv-status muted">Loading…</span>
    <button class="btn" data-a="pv-close">Close</button>${pv.copy ? `<button class="btn" data-a="pv-copy">Copy text</button>` : ""}${share ? `<button class="btn" data-a="pv-share">Share</button>` : ""}${ENV ? `<button class="btn" data-a="pv-save">Save to Drive</button><button class="btn primary" data-a="pv-dl">Download</button>` : `<button class="btn primary" data-a="pv-save">Download</button>`}
    ${share ? "" : `<p class="pv-tip muted">To send it on WhatsApp or email, tap Download, then share the file from your phone.</p>`}</div><div class="pv-pages"></div>`;
  document.body.appendChild(box); document.body.style.overflow = "hidden";
  const wrap = box.querySelector(".pv-pages"); const status = box.querySelector(".pv-status");
  if (pv.kind !== "pdf") {
    // Images and Excel show the timetable grid they contain.
    const img = new Image(); img.alt = pv.name; img.src = pv.canvas.toDataURL("image/png"); wrap.appendChild(img);
    status.textContent = pv.kind === "xlsx" ? "Excel file: same grid, editable in Excel" : "Image";
    return;
  }
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await lib.getDocument({ data: new Uint8Array(await pv.blob.arrayBuffer()) }).promise;
    const cssW = Math.min(pv.wide ? 1100 : 820, wrap.clientWidth - 8); const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let i = 1; i <= pdf.numPages; i++) {
      if (!box.isConnected) return;
      const page = await pdf.getPage(i); const vp0 = page.getViewport({ scale: 1 }); const vp = page.getViewport({ scale: (cssW / vp0.width) * dpr });
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height); c.style.width = cssW + "px"; c.setAttribute("aria-label", "Page " + i);
      wrap.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
    status.textContent = pdf.numPages + (pdf.numPages === 1 ? " page" : " pages");
  } catch (e) {
    console.error(e);
    status.textContent = "Preview isn't available here. You can still download or share the " + type + ".";
  }
}
// On Google the file can also go straight to the phone or computer, not only to Drive.
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function closePreview() { document.querySelector(".pdfprev")?.remove(); document.body.style.overflow = ""; S.preview = null; }
// Share opens the phone's own share menu (Android / iPhone) with the file attached. The button only shows where
// the browser allows it; pages inside claude.ai are not allowed today, so there the viewer downloads, then shares.
function previewFile(pv) { return new File([pv.blob], pv.name, { type: pv.blob.type || "application/octet-stream" }); }
function canShareFiles(pv) { try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [previewFile(pv)] })); } catch { return false; } }
async function sharePreview() {
  const pv = S.preview; if (!pv) return;
  try { await navigator.share({ files: [previewFile(pv)], title: pv.name, text: pv.shareText || "" }); }
  catch (e) { if (e?.name !== "AbortError") toast("Sharing isn't allowed here. Tap Download, then share the file from your phone."); }
}
// On Google Drive the report PDF is filed in the project folder as soon as a report is submitted.

async function buildReportPdf(r, p) {
  {
    const jsPDF = await loadPdfLibs();
    const W = 210, H = 297, M = 15, CW = W - 2 * M, BOTTOM = H - 15;
    const info = [["Project Name:", p.name], ["Project No:", p.code], ["Client:", p.client], ["Location:", p.location], ["Date:", fmtDMY(r.date)]];
    const sum = activitySummary(p, r);
    const tt = drawTimetable(p, { prog: r.progress, actual: actualDays(p, r.date), scale: 3 });
    const ratio = tt.height / tt.width;
    let doc, y, TOP;
    const header = () => pdfLetterhead(doc, W, "Project Progress Report", info, ["Report No:", repNo(r.reportNo)]);
    const heading = (t) => { doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(0, 0, 0); doc.text(t, M + 1, y); y += 5; };
    const remarkLines = () => { doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); return doc.splitTextToSize(r.remarks || "-", CW - 22); };
    const remarks = (label) => { const lines = remarkLines(); doc.text(label, M + 1, y); doc.text(lines, M + 22, y); y += lines.length * 5 + 4; };

    // The client report is always 2 pages. Page 1 shrinks the summary table step by step until the timetable has room.
    const LEVELS = [[10, 2.6, 11], [9, 2, 10], [8, 1.5, 9], [7, 1.1, 8], [6, 0.7, 7]];
    let room = 0;
    for (let li = 0; li < LEVELS.length; li++) {
      const [fs, pad, hfs] = LEVELS[li];
      doc = new jsPDF({ unit: "mm", format: "a4" });
      TOP = header(); y = TOP;
      heading("1.0 ACTIVITY SUMMARY:"); y += 1;
      doc.autoTable({
        startY: y, margin: { left: M, right: M, top: TOP, bottom: 15 }, theme: "grid",
        headStyles: { fillColor: [95, 122, 97], textColor: 255, fontStyle: "bold", fontSize: hfs, halign: "center", lineColor: 0, lineWidth: 0.25, cellPadding: pad },
        styles: { font: "helvetica", fontSize: fs, cellPadding: pad, lineColor: 0, lineWidth: 0.25, textColor: 0, valign: "middle" },
        columnStyles: { 0: { cellWidth: 11, halign: "center" }, 1: { cellWidth: 52 }, 3: { cellWidth: 30, halign: "center" } },
        head: [["NO", "TASK", "DESCRIPTION", "STATUS"]],
        body: sum.length ? sum.map((s, i) => [String(i + 1), s.a.name, s.note, s.f >= 1 ? "Completed" : "Ongoing"]) : [["-", "-", "No activity notes in this report.", "-"]]
      });
      y = doc.lastAutoTable.finalY + 8;
      room = BOTTOM - (y + 18) - (remarkLines().length * 5 + 6);
      const fits = doc.getNumberOfPages() === 1 && room >= Math.min(CW * ratio, 75);
      if (fits || li === LEVELS.length - 1) break;
    }
    while (doc.getNumberOfPages() > 1) doc.deletePage(doc.getNumberOfPages());
    heading("2.0 PROGRESS SUMMARY:"); y += 3;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.text("Scheduled Completion:", M + 1, y); doc.text("Actual Completion:", M + 1, y + 5.5);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.text(pct(r.scheduledPct), M + 52, y);
    doc.setTextColor(0, 176, 80); doc.text(pct(r.actualPct), M + 52, y + 5.5); doc.setTextColor(0, 0, 0);
    y += 10;
    const ttH = Math.max(20, Math.min(CW * ratio, room)), ttW = ttH / ratio;
    y += pdfImage(doc, tt, M + (CW - ttW) / 2, y, ttW, ttH) + 6;
    remarks("Remarks:");

    doc.addPage(); y = header();
    heading("3.0 PROJECT PHOTOS:"); y += 3;
    const photos = slots(r).filter((ph) => ph && isAsset(ph.id));
    const cw = (CW - 14) / 2;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    const capRows = [];
    for (let i = 0; i < photos.length; i += 2) capRows.push(photos.slice(i, i + 2).map((ph) => doc.splitTextToSize(ph.caption || "", cw).slice(0, 3)));
    // Photos shrink so both rows, the remarks and End of Report stay on page 2.
    const capH = capRows.reduce((s, row) => s + 10 + Math.max(...row.map((c) => c.length)) * 4, 0);
    const ch = Math.min(58, (BOTTOM - y - capH - (remarkLines().length * 5 + 4) - 16) / Math.max(1, capRows.length));
    for (let i = 0; i < photos.length; i += 2) {
      const pair = photos.slice(i, i + 2), caps = capRows[i / 2];
      const rowh = ch + 5 + Math.max(...caps.map((c) => c.length)) * 4 + 5;
      for (let k = 0; k < pair.length; k++) {
        const x0 = M + 3 + k * (cw + 8);
        try {
          // Every photo sits whole in the same 4:3 box, so the page looks even and nothing is cut off.
          const im = await imgData(pair[k].id, 1600, 4 / 3);
          const iw = Math.min(cw, ch * 4 / 3), ih = iw * 3 / 4, ix = x0 + (cw - iw) / 2, iy = y + (ch - ih) / 2;
          doc.addImage(im.data, "JPEG", ix, iy, iw, ih);
        } catch { doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.4); doc.rect(x0, y, cw, ch); doc.setFontSize(9); doc.text("Photo unavailable", x0 + cw / 2, y + ch / 2, { align: "center" }); }
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(0, 0, 0);
        doc.text(caps[k], x0 + cw / 2, y + ch + 5, { align: "center" });
      }
      y += rowh;
    }
    y += 4;
    remarks("Remarks:");
    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("~ End of Report ~", W / 2, y + 7, { align: "center" });
    pdfFooters(doc, W, H);
    return doc.output("blob");
  }
}

  else if (a === "ph-rm") mutate(() => S.plan.phases.splice(Number(t.dataset.pi), 1));
  else if (a === "ph-up") { const i = Number(t.dataset.pi); if (i > 0) mutate(() => { const ph = S.plan.phases; [ph[i - 1], ph[i]] = [ph[i], ph[i - 1]]; }); }
  else if (a === "act-add") mutate(() => { const ph = S.plan.phases[Number(t.dataset.pi)]; const prev = ph.activities[ph.activities.length - 1]; ph.activities.push({ id: uid(), name: "", start: prev?.end || todayISO(), end: prev?.end || todayISO(), actualStart: null, actualEnd: null }); });
  else if (a === "act-rm") mutate(() => S.plan.phases[Number(t.dataset.pi)].activities.splice(Number(t.dataset.ai), 1));
  else if (a === "act-up") mutate(() => {
    const pi = Number(t.dataset.pi), ai = Number(t.dataset.ai); const list = S.plan.phases[pi].activities;
    if (ai > 0) [list[ai - 1], list[ai]] = [list[ai], list[ai - 1]];
    else if (pi > 0) S.plan.phases[pi - 1].activities.push(list.shift());
  });
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.a === "obs-hol") { const v = t.checked; mutate(() => { S.plan.observeHolidays = v; }); }
  else if (t.dataset.a === "wd") { const d = Number(t.dataset.d), on = t.checked; mutate(() => { const set = new Set(workdays(S.plan)); on ? set.add(d) : set.delete(d); S.plan.workdays = [...set].sort(); }); }
  else if (S.view === "plan" && (t.dataset.pa || t.dataset.ph !== undefined)) { if (S.editSnap) { pushUndo(S.editSnap); S.editSnap = null; } if (t.dataset.pa && t.dataset.pa !== "name") rerenderPlan(); }
  else if (t.id === "imp-file") { importFile(t.files[0]); t.value = ""; }
  else if (t.dataset.slot !== undefined && t.type === "file") { addPhoto(t.files[0], Number(t.dataset.slot)); t.value = ""; }
  else if (t.id === "xl-in") { importReportXlsx(t.files[0]); t.value = ""; }
  else if (t.dataset.a === "archive") S.plan.archived = t.checked;
  else if (t.dataset.k === "date" && S.draft) { S.draft.date = t.value; render(); touch(); }
});
document.addEventListener("focusin", (ev) => { const t = ev.target; if (S.view === "plan" && S.plan && (t.dataset?.pa || t.dataset?.ph !== undefined)) S.editSnap = snapPlan(S.plan); });
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".pcard")) { ev.preventDefault(); ev.target.dataset.a === "open-plan" ? openSetup(S.plans.get(ev.target.dataset.id), "plan") : go("project", { pid: ev.target.dataset.id }); }
  if (S.view === "plan" && (ev.ctrlKey || ev.metaKey) && !ev.target.matches("input, textarea")) {
    const k = ev.key.toLowerCase();
    if (k === "z" && !ev.shiftKey) { ev.preventDefault(); undoRedo("undo"); }
    else if (k === "y" || (k === "z" && ev.shiftKey)) { ev.preventDefault(); undoRedo("redo"); }
  }
  if (ev.key === "Escape") { document.querySelector(".lightbox")?.remove(); if (document.querySelector(".pdfprev")) closePreview(); }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (S.view === "edit" && S.draft) {
    const k = t.dataset.k;
    if (k === "pct") { const v = Math.max(0, Math.min(100, Number(t.value) || 0)); setPct(t.dataset.act, v / 100, false); }
    else if (k === "note") { const v = t.value; if (v.trim()) S.draft.notes[t.dataset.act] = v; else delete S.draft.notes[t.dataset.act]; touch(); }
    else if (k === "remarks") { S.draft.remarks = t.value; touch(); }
    else if (k === "preparedBy") { S.draft.preparedBy = t.value; touch(); }
    else if (k === "reportNo") { S.draft.reportNo = Math.max(1, parseInt(t.value, 10) || 1); touch(); }
    else if (k === "caption") { const ph = S.draft.photos[Number(t.dataset.i)]; if (ph) { ph.caption = t.value; touch(); } }
  }
  if (t.dataset.k === "person-q") { personSearch(t.dataset.prefix, t.value); return; }
  if (S.view === "plan" && S.plan) {
    if (t.dataset.pk) S.plan[t.dataset.pk] = t.value;
    else if (t.dataset.ph !== undefined) S.plan.phases[Number(t.dataset.ph)].name = t.value;
    else if (t.dataset.pa) { const a = S.plan.phases[Number(t.dataset.pi)].activities[Number(t.dataset.ai)]; a[t.dataset.pa] = t.value; wCache.delete(S.plan); }
  }
});
document.addEventListener("focusin", (ev) => { if (ev.target.dataset?.k === "person-q" && !ev.target.value) personSearch(ev.target.dataset.prefix, ""); });
async function personSearch(prefix, q) {
  if (!S.user) return;
  const hits = await S.user.search(q);
  S.search = hits.map((h) => ({ id: h.id, name: h.name }));
  hits.forEach((h) => { S.names[h.id] = h.name; if (h.avatarUrl) S.avatars[h.id] = h.avatarUrl; });
  const box = $("#" + prefix + "-res"); if (!box) return;
  const sel = prefix === "pe" ? S.plan?.engineerId : S.transfer?.id;
  box.hidden = !S.search.length;
  box.innerHTML = S.search.map((h) => `<button type="button" data-a="pick-person" data-prefix="${prefix}" data-id="${esc(h.id)}" class="${h.id === sel ? "on" : ""}">${avatar(h.id, 22)}<span>${esc(h.name)}</span></button>`).join("");
}
function setPct(actId, f, fromButton) {
  S.draft.progress[actId] = Math.round(f * 1000) / 1000;
  const row = document.querySelector(`.act[data-act="${CSS.escape(actId)}"]`);
  if (row) {
    if (fromButton) row.querySelector(".pct-in").value = Math.round(f * 100);
    row.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === Math.round(f * 100)));
    row.querySelector(".st").innerHTML = statusChip(f);
  }
  updateEditorSummary(); touch();
}
function rerenderPlan() { if (S.plan) wCache.delete(S.plan); const y = window.scrollY; render(); window.scrollTo(0, y); }
async function leaveEditorTo(fn) { try { await saveDraft(); } catch { return; } S.draft = null; fn(); }
document.addEventListener("dragover", (ev) => { const d = ev.target.closest?.(".drop[data-slot]"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (ev) => { ev.target.closest?.(".drop[data-slot]")?.classList.remove("over"); });
document.addEventListener("drop", (ev) => { const d = ev.target.closest?.(".drop[data-slot]"); if (d) { ev.preventDefault(); d.classList.remove("over"); addPhoto(ev.dataTransfer.files[0], Number(d.dataset.slot)); } });

/* ---------- browser Back / Forward (phone back, Alt+Left, mouse back) ---------- */
const NAV = { list: [], i: 0, skip: false };
function navCur() { return { v: S.view, pid: S.pid || null, rid: S.rid || null }; }
function navKey(s) {
  if (!s) return "";
  if (s.v === "project") return "project|" + s.pid;
  if (s.v === "report") return "report|" + s.rid;
  if (s.v === "edit" || s.v === "plan") return s.v + "|" + (s.pid || "") + "|" + (s.rid || "");
  return s.v;
}
function navRecord() {
  const cur = navCur(), k = navKey(cur);
  if (!NAV.list.length || k === navKey(NAV.list[NAV.i])) { NAV.list[NAV.i] = cur; history.replaceState({ fl: 1, i: NAV.i, s: cur }, ""); return; }
  // the in-page "← back" button went to the page we came from: step back in history instead of adding a new entry
  if (NAV.i > 0 && k === navKey(NAV.list[NAV.i - 1])) { NAV.skip = true; NAV.i--; NAV.list[NAV.i] = cur; history.back(); return; }
  NAV.list.length = NAV.i + 1; NAV.list.push(cur); NAV.i++;
  history.pushState({ fl: 1, i: NAV.i, s: cur }, "");
}
NAV.list = [navCur()]; history.replaceState({ fl: 1, i: 0, s: NAV.list[0] }, "");
window.addEventListener("popstate", async (ev) => {
  if (NAV.skip) { NAV.skip = false; return; }
  const st = ev.state; if (!st || !st.fl) return;
  const from = NAV.i, to = st.i, t = st.s || { v: "home" };
  const stay = () => { NAV.skip = true; history.go(from - to); };
  if (S.view === "plan" && S.plan && S.planSnap && JSON.stringify(S.plan) !== S.planSnap && !confirm("Leave without saving the timetable changes?")) return stay();
  if (S.view === "edit" && S.draft) { let ok = false; await leaveEditorTo(() => { ok = true; }); if (!ok) return stay(); }
  if (S.view === "plan") { S.plan = null; S.search = []; S.shift = null; }
  let v = t.v; const opts = {};
  if (v === "edit" || v === "plan") v = t.pid ? "project" : "home";   // editors can't be reopened from history
  if (v === "project" && !(S.projects && S.projects.get && S.projects.get(t.pid))) v = "home";
  if (t.pid) opts.pid = t.pid;
  if (t.rid) opts.rid = t.rid;
  NAV.i = to; NAV.list[to] = { v: v, pid: t.pid || S.pid || null, rid: t.rid || S.rid || null };
  go(v, opts);
});

/* ---------- boot ---------- */
function liveRender() { if (S.view === "home" || S.view === "project" || S.view === "report" || S.view === "holidays") render(); }
async function boot() {
  render();
  if (!window.claude?.use) { S.noDb = true; S.loaded.projects = true; render(); return; }
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map((n) => window.claude.use(n).catch(() => null)));
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
  if (user) {
    S.me = await user.me();
    S.canWrite = await user.can("data.write");
    S.isManager = await user.canEdit();
    try { const f = localStorage.getItem("pp-filter"); if (f === "mine" || f === "all") S.filter = f; } catch {}
    if (S.me) { $("#who").innerHTML = `<img src="${esc(S.me.avatarUrl)}" alt=""><span class="who-txt"><b>${esc(S.me.name || "You")}</b>${S.me.email ? `<small>${esc(S.me.email)}</small>` : ""}</span>`; $("#who").title = "Signed in as " + (S.me.email || S.me.name || "you"); }
  }
  if (!db) { S.noDb = true; S.loaded.projects = true; render(); return; }
  db.doc("settings/calendar").onSnapshot((snap) => {
    HOL.clear();
    ((snap.exists && snap.data().holidays) || []).forEach((h) => { if (validDate(h?.date)) HOL.set(h.date, String(h.name || "Public holiday")); });
    liveRender();
  }, () => {});
  db.collection("projects").onSnapshot((snap) => {
    S.projects = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.loaded.projects = true; liveRender();
  }, () => { S.loaded.projects = true; liveRender(); });
  db.collection("plans").onSnapshot((snap) => {
    S.plans = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    liveRender();
  }, () => {});
  db.collection("reports").onSnapshot((snap) => {
    S.reports = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.loaded.reports = true; liveRender();
  }, () => { S.loaded.reports = true; liveRender(); });
}
boot();
})();
</script>
