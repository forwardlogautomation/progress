<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F7A61">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Projects · Progress · Forwardlog</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: app shell — sticky top bar, one working column (max 1120px), screens swap in place. */
:root {
  --bg: #F3F5F2;
  --surface: #ffffff;
  --sunken: #F7F9F7;
  --ink: #262A27;
  --muted: #6B6B6B;
  --line: #E2E7E2;
  --brand: #5F7A61;
  --brand-dk: #475C4A;
  --brand-soft: #E9F0E9;
  --sched: #c9a227;
  --sched-soft: #f4ead0;
  --actual: #5F7A61;
  --ok: #2E7D4F;
  --ok-soft: #E2F3E8;
  --warn: #B7791F;
  --warn-soft: #FDF1DC;
  --bad: #C0392B;
  --bad-soft: #FBE4E1;
  --info: #2f62a8;
  --info-soft: #e0eaf7;
  --btn: #5F7A61;
  --btn-ink: #ffffff;
  --nonwork: rgba(27, 34, 30, .05);
  --f-display: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 11px;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(40,60,45,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --sunken: #232b26; --ink: #e6ece8; --muted: #9aa69f; --line: #2f3933;
    --brand: #9DBA9F; --brand-dk: #7FA083; --brand-soft: #26332A; --sched: #d9b648; --sched-soft: #3a3320; --actual: #5fb878;
    --ok: #6fcf8f; --ok-soft: #1f3a29; --warn: #f0a050; --warn-soft: #3d2c19; --bad: #f2877c; --bad-soft: #42211e;
    --info: #8db6ee; --info-soft: #1e2d42; --btn: #7FA083; --btn-ink: #10150F; --nonwork: rgba(230, 236, 232, .05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --sunken: #232b26; --ink: #e6ece8; --muted: #9aa69f; --line: #2f3933;
  --brand: #9DBA9F; --brand-dk: #7FA083; --brand-soft: #26332A; --sched: #d9b648; --sched-soft: #3a3320; --actual: #5fb878;
  --ok: #6fcf8f; --ok-soft: #1f3a29; --warn: #f0a050; --warn-soft: #3d2c19; --bad: #f2877c; --bad-soft: #42211e;
  --info: #8db6ee; --info-soft: #1e2d42; --btn: #7FA083; --btn-ink: #10150F; --nonwork: rgba(230, 236, 232, .05);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { display: flex; align-items: center; gap: 12px; min-height: 54px; }
.wordmark { font-family: var(--f-display); font-weight: 700; font-stretch: 100%; letter-spacing: .02em; font-size: 1.05rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.wordmark b { color: var(--brand); font-weight: 700; }
.topbar .sep { width: 1px; height: 20px; background: var(--line); }
.topbar .ctx { font-size: .9rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.topbar .who img { width: 26px; height: 26px; border-radius: 50%; }
.topbar .who .who-txt { display: grid; line-height: 1.2; min-width: 0; }
.topbar .who b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.topbar .who small { font-size: .75rem; overflow: hidden; text-overflow: ellipsis; }

.wrap { padding-block: 14px 96px; display: grid; gap: 22px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head > div { display: grid; gap: 6px; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: .9rem; justify-self: start; }
.back:hover { color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 550; font-size: .92rem; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font-weight: 550; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.section { display: grid; gap: 14px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.idle { background: var(--sunken); color: var(--muted); }

.notice { padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: .9rem; }
.notice.info { background: var(--info-soft); }

/* Home */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-display); font-stretch: 85%; font-size: 1.9rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pcard { padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; transition: border-color .15s; }
.pcard:hover { border-color: var(--muted); }
.pcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pcard .code { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.pcard .meta { font-size: .88rem; color: var(--muted); }
.pcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

.meter { position: relative; height: 10px; border-radius: 5px; background: var(--sunken); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--actual); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--sched); border-radius: 1px; }
.meter-legend { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--muted); }
.meter-legend b { color: var(--ink); font-weight: 600; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.key.a { background: var(--actual); }
.key.s { background: var(--sched); }

.empty { padding: 36px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty p { max-width: 46ch; color: var(--muted); }

/* Project */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-stretch: 85%; font-size: 1.7rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: .82rem; color: var(--muted); }
.chartcard { padding: 16px; display: grid; gap: 10px; }
.chartcard svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }

.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.gantt { --dw: 26px; --lab: 280px; min-width: max-content; font-size: .84rem; }
.g-row { display: flex; border-bottom: 1px solid var(--line); min-height: 34px; }
.g-row:last-child { border-bottom: 0; }
.g-lab { position: sticky; left: 0; z-index: 2; width: var(--lab); flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.g-lab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.g-lab .pc { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); flex: none; }
.g-row.phase .g-lab { font-weight: 650; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
.g-row.phase .g-track { background-color: var(--sunken); }
.g-track { position: relative; width: calc(var(--n) * var(--dw)); flex: none; background-image: repeating-linear-gradient(to right, transparent 0 calc(var(--dw) - 1px), var(--line) calc(var(--dw) - 1px) var(--dw)); }
.g-head .g-lab { font-size: .76rem; color: var(--muted); font-weight: 600; }
.g-head .g-track { display: flex; background-image: none; }
.g-day { width: var(--dw); flex: none; text-align: center; font-size: .7rem; line-height: 1.25; padding: 4px 0; color: var(--muted); border-right: 1px solid var(--line); }
.g-day b { display: block; color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-size: .74rem; }
.g-day.nw { background: var(--nonwork); }
.g-day.mo { box-shadow: inset 2px 0 0 var(--muted); }
.g-nw { position: absolute; top: 0; bottom: 0; width: var(--dw); background: var(--nonwork); }
.g-bar { position: absolute; height: 8px; border-radius: 3px; }
.g-bar.s { top: 7px; background: var(--sched); opacity: .85; }
.g-bar.a { top: 18px; background: var(--actual); }
.g-bar.a.open { background: repeating-linear-gradient(-45deg, var(--actual) 0 5px, transparent 5px 8px); border: 1px solid var(--actual); }
.g-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--info); opacity: .7; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunken); }
.tbl .r { text-align: right; }

/* Editor */
.ed-meta { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.input, textarea.input, select.input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
textarea.input { resize: vertical; min-height: 64px; line-height: 1.45; }
.input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
.phase-block { display: grid; }
.phase-title { padding: 10px 16px; font-size: .76rem; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line); }
.phase-block:first-child .phase-title { border-radius: 10px 10px 0 0; }
.act { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.phase-block:last-child .act:last-child { border-bottom: 0; }
.act-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }
.act-name { display: grid; gap: 2px; min-width: 0; flex: 1 1 240px; }
.act-name .plan { font-size: .8rem; color: var(--muted); }
.pct-ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-width: 44px; min-height: 36px; font-family: var(--f-mono); font-size: .8rem; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--btn); color: var(--btn-ink); }
.pct-in { width: 76px; min-height: 36px; text-align: right; font-family: var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.act .was { font-size: .78rem; color: var(--muted); }
.done-list { padding: 12px 16px; font-size: .84rem; color: var(--muted); line-height: 1.6; }
.done-list b { color: var(--ink); font-weight: 550; }
.toggle-done { padding: 10px 16px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--brand); cursor: pointer; font-weight: 550; font-size: .88rem; }

.sumgrid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.sumbox { display: grid; gap: 10px; align-content: start; }
.bigpair { display: flex; gap: 22px; flex-wrap: wrap; }
.bigpair div { display: grid; }
.bigpair .v { font-family: var(--f-display); font-stretch: 85%; font-size: 1.8rem; font-weight: 650; font-variant-numeric: tabular-nums; }

.crew { padding: 6px 16px; display: grid; }
.crew-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crew-row:last-child { border-bottom: 0; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stepper button { width: 40px; min-height: 38px; border: 0; background: var(--surface); cursor: pointer; font-size: 1.1rem; }
.stepper input { width: 48px; text-align: center; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 38px; font-family: var(--f-mono); background: var(--surface); }

.photos { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.ph { display: grid; gap: 8px; align-content: start; }
.ph .img { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--sunken); display: grid; place-items: center; color: var(--muted); font-size: .82rem; position: relative; }
.ph .img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ph .rm { position: absolute; top: 6px; right: 6px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; color: var(--muted); cursor: pointer; font-size: .9rem; }
.drop:hover, .drop.over { border-color: var(--brand); color: var(--brand); }

.bar-actions { position: sticky; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); margin-top: -1px; }
.bar-actions .in { max-width: 1120px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar-actions .status { font-size: .84rem; color: var(--muted); margin-right: auto; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; }

/* Report sheet */
.sheet { padding: clamp(18px, 4vw, 40px); display: grid; gap: 26px; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.sheet-head .co { font-size: .74rem; color: var(--muted); max-width: 44ch; line-height: 1.45; }
.sheet h1 { font-size: 1.6rem; }
.rinfo { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 24px; font-size: .92rem; }
.rinfo div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.rinfo dt { width: 104px; flex: none; color: var(--muted); }
.rinfo dd { margin: 0; font-weight: 550; min-width: 0; overflow-wrap: anywhere; }
.sheet .sec { display: grid; gap: 12px; }
.sheet .sec > h2 { font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; }
.sheet .photos { padding: 0; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.sheet .ph .img { cursor: zoom-in; }
.sheet .ph p { font-size: .88rem; }
.end { text-align: center; color: var(--muted); font-size: .85rem; }
.remarks { white-space: pre-wrap; }

/* Plan editor */
.plan-act { display: grid; grid-template-columns: minmax(180px, 2.2fr) repeat(2, minmax(130px, 1fr)) auto; gap: 8px; align-items: end; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.plan-act .field > span { font-size: .7rem; }
.plan-phase-head { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--sunken); border-bottom: 1px solid var(--line); }
.plan-phase-head .input { font-weight: 600; }
.plan-foot { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; color: var(--muted); flex: none; }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
.wd { display: flex; flex-wrap: wrap; gap: 6px; }
.wd label { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: .86rem; }
.wd input { accent-color: var(--brand); }
.roles { display: grid; gap: 8px; }
.role-row { display: flex; gap: 8px; }

.g-nw.hol, .g-day.hol { background: var(--bad-soft); }
.g-day.hol { color: var(--bad); }
.av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: .7rem; font-weight: 700; flex: none; object-fit: cover; }
.av.empty { background: var(--sunken); color: var(--muted); }
.eng { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; line-height: 1.25; }
.picker { display: grid; gap: 6px; }
.picker-results { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.picker-results button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.picker-results button:last-child { border-bottom: 0; }
.picker-results button:hover, .picker-results button.on { background: var(--brand-soft); }
.lockbar { padding: 12px 16px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.g-bar.r { top: 26px; height: 4px; background: var(--muted); opacity: .45; }
.g-day.pick { cursor: pointer; }
.g-day.pick:hover { outline: 2px solid var(--brand); outline-offset: -2px; }
.g-day.xw { box-shadow: inset 0 -3px 0 var(--ok); }
.seg-filter { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg-filter button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; font-size: .86rem; }
.seg-filter button.on { background: var(--btn); color: var(--btn-ink); }
.warnlist { display: grid; gap: 6px; }

      '<div style="font-size:10px;font-weight:800;letter-spacing:1.6px;color:#5F7A61;text-transform:uppercase">Progress Reports</div>' +

      '<p style="margin:0 0 18px;color:#6B6B6B;font-size:13.5px">Use your @' + DOMAIN + ' Google account. You stay signed in on this device.</p>' +

      '<p id="fl-msg" style="margin:14px 0 0;color:#C0392B;font-size:13px;font-weight:600"></p>' +
      '<p style="margin:18px 0 0;color:#7A807B;font-size:11px">Forwardlog <b style="color:#5F7A61">Automation</b></p></div>';

  }

  function signOut() {

    const b = document.createElement("button");
    b.id = "fl-signout"; b.type = "button"; b.textContent = "Sign out"; b.title = "Sign out of Progress Reports";
    b.style.cssText = "margin-left:8px;border:1px solid var(--line,#d8dfda);background:transparent;color:inherit;border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;flex:0 0 auto";

  }
  // Page errors go to the Apps Script Executions log, prefixed PAGE:.
  const report = (msg) => { try { post("logClientError", [String(msg).slice(0, 1800)], "").catch(() => {}); } catch (e) {} };

  const subs = new Set();

  const meta = { fromCache: false, hasPendingWrites: false };
  const snapColl = (c) => {
    const docs = [...store[c].entries()].map(([id, d]) => ({ id, exists: true, data: () => d, metadata: meta }));
    return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] };
  };
  const snapDoc = (c, id) => { const d = store[c] && store[c].get(id); return { id, exists: !!d, data: () => d, metadata: meta }; };
  const fire = (s) => { try { s.coll ? s.cb(snapColl(s.coll)) : s.cb(snapDoc(s.c, s.id)); } catch (e) { console.error(e); } };
  const fireFor = (c, id) => subs.forEach((s) => { if (s.coll === c || (s.c === c && s.id === id)) fire(s); });

    b.textContent = msg; document.body.appendChild(b);
  }
  /* Speed: the records from the last visit are kept on this device and shown at once;
     the full, fresh copy is loaded from the Sheet straight after and replaces them. Saving waits for the fresh copy. */
  const CACHE_KEY = "fl_prog_cache_v1";
  let live = null, me = null;

      const changes = [];

      const s = JSON.stringify({ email: me && me.email, me, version: since, changes });

    } catch (e) { ls.del(CACHE_KEY); }

      m.innerHTML = '<form style="background:#fff;border-radius:14px;border-top:4px solid #5F7A61;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:22px 20px;max-width:360px;width:100%">' +
        '<div style="font-size:10px;font-weight:800;letter-spacing:1.6px;color:#5F7A61;text-transform:uppercase">Submit report</div>' +
        '<h2 style="margin:4px 0 6px;font-size:18px">Enter the submit password</h2>' +
        '<p style="margin:0 0 12px;color:#6B6B6B;font-size:13px">Ask your project manager if you don\'t have it. It is remembered until you close this tab.</p>' +
        '<input type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #CBD3CB;border-radius:11px">' +
        '<p class="pw-msg" style="margin:8px 0 0;color:#C0392B;font-size:13px;font-weight:600;min-height:1em"></p>' +
        '<div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="pw-cancel" style="flex:1;min-height:44px;border:0;border-radius:11px;background:#EDF1ED;font:inherit;font-weight:700;color:#262A27">Cancel</button>' +
        '<button type="submit" style="flex:1;min-height:44px;border:0;border-radius:11px;background:#5F7A61;color:#fff;font:inherit;font-weight:700">Submit</button></div></form>';
      document.body.appendChild(m);

    upload: async (blob, opts) => {

    delete: async () => ({ deleted: false })
  });

    save: async (req) => {
      const blob = req.data instanceof Blob ? req.data : new Blob([req.data]);

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);

const D = (iso) => new Date(iso + "T00:00:00Z");
const iso = (d) => d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const todayISO = () => { const t = new Date(); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); };
const fmtD = (s) => { if (!s) return "—"; const d = D(s); return d.getUTCDate() + " " + MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
const fmtShort = (s) => { if (!s) return "—"; const d = D(s); return d.getUTCDate() + " " + MON[d.getUTCMonth()]; };

const validDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);

/* Project calendar: weekdays worked, minus public holidays, with per-project overrides. */
const HOL = new Map();
function workdays(p) { return Array.isArray(p.workdays) ? p.workdays : [1, 2, 3, 4, 5]; }
// A locked schedule keeps the holidays that were in force when it was locked.
const holCache = new WeakMap();
function holSetOf(p) {
  if (!p.locked || !Array.isArray(p.holSnapshot)) return HOL;
  let s = holCache.get(p.holSnapshot);
  if (!s) { s = new Set(p.holSnapshot); holCache.set(p.holSnapshot, s); }
  return s;
}
function isWork(p, d) {
  if ((p.extraWork || []).includes(d)) return true;
  if ((p.extraOff || []).includes(d)) return false;
  if (p.observeHolidays !== false && holSetOf(p).has(d)) return false;
  return workdays(p).includes(D(d).getUTCDay());
}
// Grey stays on weekends, public holidays and project off days even when a day is made a work day.
function greyed(p, d) { return (p.extraOff || []).includes(d) || !isWork({ ...p, extraWork: [], extraOff: [] }, d); }
function offReason(p, d) {
  if (isWork(p, d)) return "";
  if ((p.extraOff || []).includes(d)) return "Project off day";
  if (p.observeHolidays !== false && holSetOf(p).has(d)) return HOL.get(d) || "Public holiday";
  return DOW[D(d).getUTCDay()];
}
function wdCount(p, a, b) {
  if (!validDate(a) || !validDate(b) || b < a) return 0;
  let n = 0;
  for (let d = a; d <= b; d = addDays(d, 1)) if (isWork(p, d)) n++;
  return n;
}
function addWorkdays(p, start, n) {
  let d = start, c = 0;
  for (let i = 0; i < 3000; i++) { if (isWork(p, d) && ++c >= n) return d; d = addDays(d, 1); }
  return d;
}
function calendarText(p) {
  const parts = [workdays(p).length ? workdays(p).map((d) => DOW[d]).join(", ") : "No regular days"];
  if (p.observeHolidays !== false) parts.push("public holidays off");
  if ((p.extraWork || []).length) parts.push((p.extraWork.length) + " extra work day" + (p.extraWork.length > 1 ? "s" : ""));
  if ((p.extraOff || []).length) parts.push((p.extraOff.length) + " extra off day" + (p.extraOff.length > 1 ? "s" : ""));
  return parts.join(" · ");
}
function acts(p) {
  const out = [];
  (p.phases || []).forEach((ph) => (ph.activities || []).forEach((a) => out.push({ ...a, phase: ph.name, phaseId: ph.id })));
  return out;
}
/* Progress = work days done ÷ total planned work days, across all activities.
   An activity's share is its planned work days on the project calendar. */
const wCache = new WeakMap();
function planDays(p, a) {
  let m = wCache.get(p); if (!m) { m = new Map(); wCache.set(p, m); }
  const k = a.id + "|" + a.start + "|" + a.end;
  if (!m.has(k)) m.set(k, wdCount(p, a.start, a.end));
  return m.get(k);
}
function schedFrac(p, a, date) {
  if (!validDate(a.start) || !validDate(a.end) || !validDate(date)) return 0;
  if (date < a.start) return 0;
  if (date >= a.end) return 1;
  const tot = planDays(p, a);
  return tot ? wdCount(p, a.start, date) / tot : 0;
}
function weighted(p, fn) {
  let w = 0, s = 0;
  acts(p).forEach((a) => { const wt = planDays(p, a); w += wt; s += wt * Math.max(0, Math.min(1, fn(a))); });
  return w ? s / w : 0;
}
function totalPlanDays(p) { return acts(p).reduce((s, a) => s + planDays(p, a), 0); }
/* Actual dates: imported from the timetable, extended by what reports show. */
function actualDates(p, asOf) {
  const seen = new Map(), last = {};
  projReports(p.id, true).filter((r) => !asOf || r.date <= asOf).forEach((r) => {
    acts(p).forEach((a) => {
      const f = Number(r.progress?.[a.id]) || 0; const o = seen.get(a.id) || {};
      if (f > (last[a.id] || 0) || (r.notes?.[a.id] || "").trim()) { if (!o.start) o.start = r.date; }
      if (f >= 1 && !o.end) o.end = r.date;
      if (f < 1) o.end = null;
      o.f = f; last[a.id] = f; seen.set(a.id, o);
    });
  });
  const out = new Map();
  acts(p).forEach((a) => {
    const o = seen.get(a.id) || {};
    const start = [a.actualStart, o.start].filter(validDate).sort()[0] || null;
    const end = o.f !== undefined && o.f < 1 ? null : (a.actualEnd || o.end || null);
    out.set(a.id, { start, end });
  });
  return out;
}
function isMgr() { return !!S.isManager; }
// The project engineer is a typed name; older entries may hold an account id instead.
const logName = (x) => (x?.name || (x?.id ? nameOf(x.id) : "")).trim();
function engineerOn(p, date) {
  const log = (p.engineerLog || []).slice().sort((a, b) => (a.from < b.from ? -1 : 1));
  if (!log.length) return (p.engineerName || (p.engineerId ? nameOf(p.engineerId) : "")).trim() || null;
  let n = logName(log[0]);
  log.forEach((x) => { if (!date || x.from <= date) n = logName(x); });
  return n || null;
}
// Name printed as "Prepared by": typed on the report, else the project engineer that day, else the account.
function preparedBy(p, r) { return (r.preparedBy || "").trim() || engineerOn(p, r.date) || (r.authorId ? nameOf(r.authorId) : "—"); }
function initials(name) {
  return `<span class="av" style="width:26px;height:26px" aria-hidden="true">${esc(((name || "").match(/\b\w/g) || ["?"]).slice(0, 2).join("").toUpperCase())}</span>`;
}
function avatar(id, size = 26) {
  if (!id) return `<span class="av empty" style="width:${size}px;height:${size}px" aria-hidden="true">?</span>`;
  const n = nameOf(id); const src = S.avatars[id];
  return src ? `<img class="av" src="${esc(src)}" alt="" style="width:${size}px;height:${size}px">` : `<span class="av" style="width:${size}px;height:${size}px" aria-hidden="true">${esc((n.match(/\b\w/g) || ["?"]).slice(0, 2).join("").toUpperCase())}</span>`;
}
function engineerChip(p, date) {
  const n = engineerOn(p, date);
  return `<span class="eng">${n ? initials(n) : `<span class="av empty" style="width:26px;height:26px" aria-hidden="true">?</span>`}<span><span class="eyebrow" style="display:block;font-size:.66rem">Project engineer</span>${n ? esc(n) : '<span class="muted">Not assigned</span>'}</span></span>`;
}
const projSched = (p, date) => weighted(p, (a) => schedFrac(p, a, date));
const projActual = (p, prog) => weighted(p, (a) => Number(prog?.[a.id]) || 0);
function statusOf(f) { f = Number(f) || 0; return f >= 1 ? "Completed" : f > 0 ? "Ongoing" : "Not started"; }
function statusChip(f) { const s = statusOf(f); return `<span class="chip ${s === "Completed" ? "ok" : s === "Ongoing" ? "info" : "idle"}">${s}</span>`; }
function variance(actual, sched) {
  const d = (actual - sched) * 100;
  // Small gaps count as on schedule, except once the plan says finished: then anything short of 100% is behind.
  const overdue = sched >= 0.9995 && actual < 0.9995;
  if (Math.abs(d) < 0.5 && !overdue) return { cls: "ok", label: "On schedule", text: "On schedule", d };
  return d > 0
    ? { cls: "ok", label: "Ahead " + d.toFixed(1) + " pts", text: "Ahead of schedule", d }
    : { cls: "bad", label: "Behind " + Math.abs(d).toFixed(1) + " pts", text: "Behind schedule", d };
}
function projReports(pid, submittedOnly) {
  return [...S.reports.values()].filter((r) => r.projectId === pid && (!submittedOnly || r.status === "submitted"))
    .sort((a, b) => (a.date === b.date ? (a.reportNo || 0) - (b.reportNo || 0) : a.date < b.date ? -1 : 1));
}
function latest(pid) { const l = projReports(pid, true); return l[l.length - 1] || null; }
function projDates(p) {
  let s = null, e = null;
  acts(p).forEach((a) => {
    [a.start, a.actualStart].forEach((x) => { if (validDate(x) && (!s || x < s)) s = x; });
    [a.end, a.actualEnd].forEach((x) => { if (validDate(x) && (!e || x > e)) e = x; });
  });
  return { start: s, end: e };
}
function plannedStart(p) { let s = null; acts(p).forEach((a) => { if (validDate(a.start) && (!s || a.start < s)) s = a.start; }); return s; }
function plannedFinish(p) { let e = null; acts(p).forEach((a) => { if (validDate(a.end) && (!e || a.end > e)) e = a.end; }); return e; }
function projSnapshot(p) {
  const r = latest(p.id);
  const asOf = r ? r.date : todayISO();
  const prog = r ? r.progress : {};
  return { r, asOf, actual: projActual(p, prog), sched: projSched(p, asOf) };
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function toastLink(msg, url, label) {

  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = label || "Open"; a.style.cssText = "color:inherit;font-weight:700;text-decoration:underline";

function dbErr(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "The report store is full. Ask the portal owner to remove old drafts.";
  if (c === "invalid_argument") return ENV ? "You don't have permission to change this. Ask a manager." : "You can view reports but not change them. Ask the portal owner for Contributor access.";

/* ---------- names ---------- */
let nameTimer = null;
function nameOf(id) {
  if (!id) return "—";
  if (S.names[id] !== undefined) return S.names[id] || "Team member";
  S.names[id] = undefined;
  clearTimeout(nameTimer); nameTimer = setTimeout(resolveNames, 30);
  return "…";
}
async function resolveNames() {
  if (!S.user) return;
  const ids = new Set();
  S.reports.forEach((r) => { if (r.authorId) ids.add(r.authorId); });
  S.projects.forEach((p) => {
    [p.createdBy, p.engineerId, p.lockedBy].forEach((x) => x && ids.add(x));
    (p.engineerLog || []).forEach((x) => { x.id && ids.add(x.id); x.by && ids.add(x.by); });
  });
  if (!ids.size) return;
  const ps = await S.user.profiles([...ids]);
  let changed = false;
  for (const id of ids) {
    const n = ps[id]?.name || ""; if (S.names[id] !== n) { S.names[id] = n; changed = true; }
    if (ps[id]?.avatarUrl && S.avatars[id] !== ps[id].avatarUrl) { S.avatars[id] = ps[id].avatarUrl; changed = true; }
  }
  if (changed && S.view !== "edit" && S.view !== "plan") render();
}

/* ---------- writes (one at a time per doc) ---------- */
const queues = new Map();
function write(path, data) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(() => S.db.doc(path).set(data));
  queues.set(path, next);
  return next;
}

/* ---------- render ---------- */
function setCtx(t) { $("#ctx").textContent = t; }
function render() {
  const app = $("#app");
  $("#bar").innerHTML = "";
  if (S.view === "home") app.innerHTML = viewHome();
  else if (S.view === "project") app.innerHTML = viewProject();
  else if (S.view === "report") { app.innerHTML = viewReport(); fillTimetableImg(); }
  else if (S.view === "holidays") app.innerHTML = viewHolidays();
  else if (S.view === "edit") { app.innerHTML = viewEditor(); $("#bar").innerHTML = editorBar(); updateEditorSummary(); }
  else if (S.view === "plan") { app.innerHTML = viewPlan(); $("#bar").innerHTML = planBar(); }
  wireImages(app);
}
function go(view, opts = {}) {
  if (view === "plan" && S.view !== "plan" && S.plan) S.planSnap = JSON.stringify(S.plan);
  S.view = view;
  if ("pid" in opts) S.pid = opts.pid;
  if ("rid" in opts) S.rid = opts.rid;
  S.confirm = null;
  render();
  window.scrollTo(0, 0);
  navRecord();
}
function wireImages(root) {
  root.querySelectorAll("img[data-blob]").forEach((img) => {
    const fail = () => { const box = img.parentElement; if (!box) return; img.remove(); box.insertAdjacentHTML("afterbegin", "<span>Photo unavailable</span>"); };
    img.addEventListener("error", fail, { once: true });
    if (!img.getAttribute("src") && img.dataset.id) photoSrc(img.dataset.id).then((s) => { img.src = s; }).catch(fail);
  });
}
function writeAllowed() { return S.db && S.canWrite !== false; }

function headerBlock(eyebrow, title, actions = "", back = "") {
  return `<div class="page-head"><div>${back}<p class="eyebrow">${eyebrow}</p>${title ? `<h1>${title}</h1>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
}

}

/* Home */
function viewHome() {

    out += `<div class="notice">${ENV ? "The portal couldn't reach its data. Check your connection and reload the page." : "Projects and reports live in this page's shared store, which isn't available in this view. Open the page on claude.ai while signed in to your Forwardlog account."}</div>`;
  }

    out += `<div class="notice info">You have view access. To file reports, ask the portal owner to make you a Contributor.</div>`;
  }
  if (!S.loaded.projects && !S.noDb) return out + `<div class="card empty"><h2>Loading projects…</h2></div>`;

    const ka = (da.dueToday || da.missing.length ? 0 : 1), kb = (db.dueToday || db.missing.length ? 0 : 1);

  } else {

  }

    out += `<div class="section"><h2>Archived</h2><div class="table-wrap"><table class="tbl"><tbody>${archived.map((p) => `<tr class="click" data-a="open-project" data-id="${esc(p.id)}"><td class="mono">${esc(p.code)}</td><td>${esc(p.name)}</td><td class="muted">${esc(p.client)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return out;
}

    <div class="card kpi"><span class="eyebrow">Scheduled</span><span class="v">${pct(sched)}</span><span class="s">Plan as of ${fmtShort(asOf)}</span></div>
    <div class="card kpi"><span class="eyebrow">Variance</span><span class="v" style="color:var(--${v.cls === "bad" ? "bad" : "ok"})">${v.d >= 0 ? "+" : "−"}${Math.abs(v.d).toFixed(1)}</span><span class="s">${v.text} (pts)</span></div>
    <div class="card kpi"><span class="eyebrow">Planned finish</span><span class="v" style="font-size:1.35rem">${fmtD(fin)}</span><span class="s">${fin && fin >= todayISO() ? left + " work days left" : fin ? "Past planned finish" : "Set dates in the plan"}</span></div>
  </div>`;
  const prevKey = prevRevision(p) ? `<span><span class="key" style="background:var(--muted);opacity:.5"></span>Rev. ${prevRevision(p).rev} plan</span>` : "";
  out += `<div class="card chartcard"><div class="section-head"><h2>Progress curve</h2><div class="legend"><span><span class="key s"></span>Scheduled (from plan)</span><span><span class="key a"></span>Actual (from reports)</span>${prevKey}</div></div>${sCurve(p)}</div>`;

  else out += `<div class="table-wrap"><table class="tbl stack"><thead><tr><th>No.</th><th>Date</th><th class="r">Actual</th><th class="r">Scheduled</th><th>Variance</th><th>Prepared by</th><th>Status</th></tr></thead><tbody>${reps.map((x) => {

  }).join("")}</tbody></table></div>`;
  out += `</div>`;
  return out;
}

function sCurve(p) {
  const { start, end } = projDates(p);
  const fin = plannedFinish(p);
  if (!start || !fin) return `<p class="muted">Add planned dates to activities to see the curve.</p>`;
  const reps = projReports(p.id, true);
  let last = fin;
  reps.forEach((r) => { if (r.date > last) last = r.date; });
  if (end && end > last) last = end;
  const n = Math.max(1, daysBetween(start, last));
  const W = 720, H = 230, L = 40, R = 14, T = 12, B = 30;
  const x = (d) => L + (daysBetween(start, d) / n) * (W - L - R);
  const y = (f) => T + (1 - f) * (H - T - B);
  let grid = "";
  [0, .25, .5, .75, 1].forEach((f) => { grid += `<line x1="${L}" x2="${W - R}" y1="${y(f)}" y2="${y(f)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(f) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${f * 100}</text>`; });
  const step = n > 120 ? 28 : n > 50 ? 14 : 7;
  for (let i = 0; i <= n; i += step) { const d = addDays(start, i); grid += `<text x="${x(d)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtShort(d)}</text>`; }
  let sp = "";
  for (let i = 0; i <= n; i++) { const d = addDays(start, i); sp += (i ? "L" : "M") + x(d).toFixed(1) + " " + y(projSched(p, d)).toFixed(1); }
  const prev = prevRevision(p);
  let pp = "";
  if (prev) for (let i = 0; i <= n; i++) { const d = addDays(start, i); pp += (i ? "L" : "M") + x(d).toFixed(1) + " " + y(projSched(prev, d)).toFixed(1); }
  if (pp) grid += `<path d="${pp}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4" opacity=".7"/>`;
  const pts = [{ date: start, f: 0 }].concat(reps.filter((r) => r.date >= start).map((r) => ({ date: r.date, f: r.actualPct || 0 })));
  const ap = pts.map((q, i) => (i ? "L" : "M") + x(q.date).toFixed(1) + " " + y(q.f).toFixed(1)).join("");
  const area = pts.length > 1 ? ap + `L${x(pts[pts.length - 1].date).toFixed(1)} ${y(0)}L${x(start).toFixed(1)} ${y(0)}Z` : "";
  const lastPt = pts[pts.length - 1];
  const today = todayISO();
  const tmark = today >= start && today <= last ? `<line x1="${x(today)}" x2="${x(today)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${x(today) + 4}" y="${T + 10}" font-size="10" fill="var(--muted)">Today</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scheduled versus actual progress over time">
    ${grid}${tmark}
    <path d="${sp}" fill="none" stroke="var(--sched)" stroke-width="2" stroke-dasharray="5 4"/>
    ${area ? `<path d="${area}" fill="var(--actual)" opacity=".12"/>` : ""}
    <path d="${ap}" fill="none" stroke="var(--actual)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.slice(1).map((q) => `<circle cx="${x(q.date)}" cy="${y(q.f)}" r="3" fill="var(--actual)"/>`).join("")}
    ${pts.length > 1 ? `<circle cx="${x(lastPt.date)}" cy="${y(lastPt.f)}" r="5" fill="var(--surface)" stroke="var(--actual)" stroke-width="2.5"/><text x="${Math.min(x(lastPt.date) + 8, W - 60)}" y="${y(lastPt.f) - 8}" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${pct(lastPt.f)}</text>` : ""}
  </svg>`;
}

/* Project engineer: one per project; managers assign and transfer, with a dated handover log. */
function pickerHTML(prefix, selected) {
  return `<div class="picker"><input class="input" id="${prefix}-q" data-k="person-q" data-prefix="${prefix}" placeholder="Search by name" autocomplete="off" aria-label="Search for an engineer">
    <div class="picker-results" id="${prefix}-res" ${S.search.length ? "" : "hidden"}>${S.search.map((h) => `<button type="button" data-a="pick-person" data-prefix="${prefix}" data-id="${esc(h.id)}" class="${h.id === selected ? "on" : ""}">${avatar(h.id, 22)}<span>${esc(h.name)}</span></button>`).join("")}</div>
    ${selected ? `<span class="eng">${avatar(selected)}<span>Selected: <strong>${esc(nameOf(selected))}</strong></span></span>` : ""}</div>`;
}
function engineerBlock(p) {
  const t = S.transfer && S.transfer.pid === p.id ? S.transfer : null;
  const log = (p.engineerLog || []).slice().sort((a, b) => (a.from < b.from ? -1 : 1));
  let h = `<div class="card lockbar">${engineerChip(p)}`;
  if (isMgr() && !t) h += `<button class="btn small" data-a="transfer-open">${engineerOn(p) ? "Transfer project" : "Assign engineer"}</button>`;
  if (log.length > 1) h += `<details style="flex-basis:100%"><summary class="linkbtn" style="cursor:pointer">Handover log (${log.length})</summary><div class="table-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>From</th><th>Engineer</th><th>Changed by</th></tr></thead><tbody>${log.map((x) => `<tr><td style="white-space:nowrap">${fmtD(x.from)}</td><td>${esc(logName(x))}</td><td class="muted">${esc(x.by ? nameOf(x.by) : "—")}</td></tr>`).join("")}</tbody></table></div></details>`;
  if (t) h += `<div style="flex-basis:100%;display:grid;gap:10px;max-width:520px">
      <label class="field"><span>${engineerOn(p) ? "Transfer to" : "Assign to"} (engineer's name)</span><input class="input" id="tr-name" value="${esc(t.name || "")}" placeholder="e.g. Ali Rahman" autocomplete="off"></label>
      <label class="field" style="max-width:220px"><span>Effective from</span><input class="input" type="date" id="tr-date" value="${esc(t.date)}"></label>
      <div class="slot-actions"><button class="btn primary small" data-a="transfer-save">${engineerOn(p) ? "Transfer" : "Assign"}</button><button class="btn small" data-a="transfer-cancel">Cancel</button></div></div>`;
  return h + `</div>`;
}
async function saveTransfer() {
  const p = S.projects.get(S.transfer.pid); const t = S.transfer;
  t.date = $("#tr-date").value; t.name = ($("#tr-name").value || "").trim();
  if (!t.name) { toast("Type the engineer's name first."); $("#tr-name").focus(); return; }
  if (!validDate(t.date)) { toast("Set the date the handover takes effect."); return; }
  if (t.name.toLowerCase() === (engineerOn(p, t.date) || "").toLowerCase()) { toast(t.name + " is already the engineer on that date."); return; }
  const body = clone(p); delete body.id;
  const cur = engineerOn(p);
  const log = body.engineerLog && body.engineerLog.length ? body.engineerLog.map((x) => ({ ...x, name: logName(x) })) : (cur ? [{ name: cur, from: projDates(p).start || t.date, by: body.createdBy || null, at: body.createdAt || null }] : []);
  body.engineerLog = log.filter((x) => x.from !== t.date).concat({ name: t.name, from: t.date, by: S.me?.id || null, at: new Date().toISOString() });
  body.engineerName = engineerOn({ engineerLog: body.engineerLog }, todayISO()); delete body.engineerId;
  body.updatedAt = new Date().toISOString();
  try { await write("projects/" + p.id, body); } catch (e) { toast(dbErr(e)); return; }
  S.projects.set(p.id, { id: p.id, ...body });
  S.transfer = null; S.search = [];
  toast(t.name + " is the engineer from " + fmtD(t.date));
  render();
}
function prevRevision(p) {
  const r = (p.revisions || []).slice(-1)[0];
  return r ? { ...r, id: p.id, locked: true } : null;
}
function gantt(p, asOf, prog, opt = {}) {
  let { start, end } = projDates(p);
  const prev = opt.prev || null;
  if (prev) { const pd = projDates(prev); if (pd.start && pd.start < start) start = pd.start; if (pd.end && pd.end > end) end = pd.end; }
  const act = opt.pick ? new Map() : actualDates(p, asOf);
  if (!start || !end) return `<p class="muted">Add planned dates to activities to see the timeline.</p>`;
  let last = end; if (asOf > last && daysBetween(start, asOf) < 400) last = asOf;
  const n = daysBetween(start, last) + 1;
  if (n > 400) return `<p class="muted">The plan spans more than 400 days; the day-by-day timeline is hidden.</p>`;
  const days = []; for (let i = 0; i < n; i++) days.push(addDays(start, i));
  const grey = days.map((d) => greyed(p, d));
  const nw = days.map((d, i) => (grey[i] ? `<div class="g-nw${HOL.has(d) && p.observeHolidays !== false ? " hol" : ""}" style="left:calc(${i} * var(--dw))"></div>` : HOL.has(d) ? `<div class="g-nw hol" style="left:calc(${i} * var(--dw));opacity:.5"></div>` : "")).join("");
  const prevActs = prev ? new Map(acts(prev).map((a) => [a.id, a])) : null;
  const now = asOf >= start && asOf <= last ? `<div class="g-now" style="left:calc(${daysBetween(start, asOf) + .5} * var(--dw) - 1px)"></div>` : "";
  const bar = (cls, a, b, extra = "") => {
    if (!validDate(a) || !validDate(b) || b < a) return "";
    const i = Math.max(0, daysBetween(start, a)), j = Math.min(n - 1, daysBetween(start, b));
    return `<div class="g-bar ${cls} ${extra}" style="left:calc(${i} * var(--dw) + 2px);width:calc(${j - i + 1} * var(--dw) - 4px)"></div>`;
  };
  // Scheduled bars cover work days only; an activity with none shows a dashed outline.
  const schedBars = (s, e) => {
    if (!validDate(s) || !validDate(e) || e < s) return "";
    let out = "", run = null;
    for (let d = s; d <= addDays(e, 1); d = addDays(d, 1)) {
      const w = d <= e && isWork(p, d);
      if (w && !run) run = d;
      if (!w && run) { out += bar("s", run, addDays(d, -1)); run = null; }
    }
    return out || bar("s", s, e, "none");
  };
  let rows = `<div class="g-row g-head"><div class="g-lab"><span>Activity</span><span>${opt.pick ? "Days" : "Actual"}</span></div><div class="g-track">${days.map((d, i) => {
    const dt = D(d); const first = i === 0 || dt.getUTCDate() === 1;
    const why = offReason(p, d);
    const xw = (p.extraWork || []).includes(d);
    const pickable = !!opt.pick;
    const title = why ? fmtD(d) + ": " + why + (pickable ? ". Tap to make it a work day." : "") : xw ? fmtD(d) + ": extra work day" + (pickable ? ". Tap to switch." : "") : HOL.has(d) ? fmtD(d) + ": " + HOL.get(d) + (p.locked ? " (announced after this schedule was locked)" : "") : pickable ? fmtD(d) + ": work day. Tap to make it an off day." : "";
    return `<div class="g-day${grey[i] ? " nw" : ""}${HOL.has(d) && grey[i] ? " hol" : ""}${xw ? " xw" : ""}${(p.extraOff || []).includes(d) ? " xo" : ""}${pickable ? " pick" : ""}${dt.getUTCDate() === 1 && i ? " mo" : ""}"${pickable ? ` data-a="toggle-day" data-d="${d}" role="button" tabindex="0"` : ""}${title ? ` title="${esc(title)}"` : ""}>${first ? MON[dt.getUTCMonth()] : DOW[dt.getUTCDay()][0]}<b>${dt.getUTCDate()}</b></div>`;
  }).join("")}</div></div>`;
  (p.phases || []).forEach((ph) => {
    rows += `<div class="g-row phase"><div class="g-lab"><span class="nm">${esc(ph.name)}</span></div><div class="g-track"></div></div>`;
    (ph.activities || []).forEach((a) => {
      const f = Number(prog?.[a.id]) || 0;
      const ad = act.get(a.id) || {};
      const aEnd = ad.end || (ad.start ? (asOf > ad.start ? asOf : ad.start) : null);
      const pa = prevActs?.get(a.id);
      const label = opt.pick ? `<span class="pc">${planDays(p, a)}d</span>` : `<span class="pc">${Math.round(f * 100)}%</span>`;
      rows += `<div class="g-row"><div class="g-lab" title="${esc(a.name)}"><span class="nm">${esc(a.name)}</span>${label}</div><div class="g-track">${nw}${schedBars(a.start, a.end)}${opt.pick ? "" : bar("a", ad.start, aEnd, ad.end ? "" : "open")}${pa && (pa.start !== a.start || pa.end !== a.end) ? bar("r", pa.start, pa.end) : ""}${now}</div></div>`;
    });
  });
  return `<div class="gantt-wrap"><div class="gantt" style="--n:${n}">${rows}</div></div>`;
}

/* Daily report tracking: one submitted report per work day from the first planned start. */
function reportDue(p) {
  const out = { missing: [], dueToday: false, drafts: new Set() };
  const { start } = projDates(p);
  if (p.archived || !start || !p.locked) return out;
  const subs = new Set(projReports(p.id, true).map((r) => r.date));
  projReports(p.id, false).forEach((r) => { if (r.status === "draft") out.drafts.add(r.date); });
  const last = latest(p.id);
  const done = last && (last.actualPct || 0) >= 0.9995;
  const today = todayISO();
  const end = done ? last.date : today;
  // Days marked "No work" need no report; the timetable and scheduled % stay as planned.
  const off = new Set(p.noWork || []);
  for (let d = start, i = 0; d < end && i < 1500; d = addDays(d, 1), i++) if (isWork(p, d) && !subs.has(d) && !off.has(d)) out.missing.push(d);
  out.dueToday = !done && today >= start && isWork(p, today) && !subs.has(today) && !off.has(today);
  return out;
}
function dueChip(p) {
  const d = reportDue(p);
  if (d.missing.length) return `<span class="chip bad">${d.missing.length} report${d.missing.length > 1 ? "s" : ""} missing</span>`;
  if (d.dueToday) return `<span class="chip warn">Today's report due</span>`;
  return `<span class="chip ok">Reports up to date</span>`;
}
function dueBlock(p) {
  const d = reportDue(p);
  const off = (p.noWork || []).slice().sort();
  if (!d.missing.length && !d.dueToday && !off.length) return "";
  const can = writeAllowed();
  const dates = d.missing.slice(-12);
  const btn = (date, label) => can ? `<button class="btn small" data-a="new-report" data-id="${esc(p.id)}" data-date="${date}">${label}</button>` : `<span class="chip idle">${label}</span>`;
  const noWork = (date) => can ? `<button class="linkbtn" data-a="no-work" data-id="${esc(p.id)}" data-date="${date}" title="No work on site that day, so no report is needed">No work</button>` : "";
  return `<div class="card due"><div class="section-head"><h2>Daily reports</h2><span class="muted">One report is due every work day on this project's calendar. If the team didn't work on a day, mark it No work.</span></div>
    ${d.dueToday ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip warn">Due today</span>${btn(todayISO(), d.drafts.has(todayISO()) ? "Continue today's draft" : "Write today's report")}${noWork(todayISO())}</div>` : ""}
    ${d.missing.length ? `<p><strong>${d.missing.length}</strong> past work day${d.missing.length > 1 ? "s have" : " has"} no submitted report${d.missing.length > 12 ? " (latest 12 shown)" : ""}:</p><div class="due-list">${dates.map((x) => `<span class="due-item">${btn(x, (d.drafts.has(x) ? "Draft · " : "") + fmtShort(x))}${noWork(x)}</span>`).join("")}</div>` : ""}
    ${off.length ? `<p class="muted" style="font-size:.84rem">No work, no report needed: ${off.map((x) => fmtShort(x) + (can ? ` <button class="linkbtn" data-a="no-work-undo" data-id="${esc(p.id)}" data-date="${x}" aria-label="Undo no work on ${fmtShort(x)}">undo</button>` : "")).join(" · ")}</p>` : ""}
  </div>`;
}
async function setNoWork(pid, date, on) {
  const p = S.projects.get(pid); if (!p || !validDate(date)) return;
  const body = clone(p); delete body.id;
  const set = new Set(body.noWork || []); if (on) set.add(date); else set.delete(date);
  body.noWork = [...set].sort(); body.updatedAt = new Date().toISOString();
  try { await write("projects/" + pid, body); } catch (e) { toast(dbErr(e)); return; }
  S.projects.set(pid, { id: pid, ...body });
  toast(on ? fmtShort(date) + " marked No work" : fmtShort(date) + " needs a report again");
  render();
}

/* Public holidays (shared list, stored in settings/calendar) */
function viewHolidays() {

/* Undo / Redo: snapshots of the schedule, kept with the draft. */
function snapPlan(p) { return JSON.stringify({ phases: p.phases, workdays: p.workdays, observeHolidays: p.observeHolidays, extraWork: p.extraWork, extraOff: p.extraOff }); }
function pushUndo(snap) {
  const p = S.plan; if (!p) return;
  p.history = p.history || { undo: [], redo: [] };
  const s = snap || snapPlan(p);
  if (p.history.undo[p.history.undo.length - 1] === s) return;
  p.history.undo.push(s); if (p.history.undo.length > 20) p.history.undo.shift();
  p.history.redo = [];
}
function undoRedo(dir) {
  const p = S.plan; const h = p?.history; if (!h) return;
  const from = dir === "undo" ? h.undo : h.redo, to = dir === "undo" ? h.redo : h.undo;
  if (!from.length) return;

function mutate(fn) { pushUndo(); fn(); rerenderPlan(); }

// Match an activity name from Excel to the project's activities (exact, then closest wording).

  const remSame = remAt ? String(g.get(remAt.r).get(remAt.c)).replace(/^remarks\s*:?\s*/i, "").trim() : "";
  out.remarks = remSame || String(right(g, remAt) || "").trim();

    for (const [c, v] of hr) { if (/^description$/i.test(String(v).trim())) descC = c; if (/^status$/i.test(String(v).trim())) statC = c; }
    for (let r = head.r + 1; r < head.r + 40; r++) {
      const row = g.get(r); if (!row) continue;
      const task = String(row.get(head.c) || "").trim();
      if (/progress summary/i.test([...row.values()].join(" "))) break;
      if (task) out.rows.push({ task, desc: String(row.get(descC) || "").trim(), status: String(row.get(statC) || "").trim() });
    }
  }
  // Timeline helper columns: planned days just left of the SCHEDULED label, done days just right of ACTUAL.
  for (const s of sheets.filter((s) => /timeline/i.test(s.name))) {
    const tg = await gridOf(s.path); let hdr = null;
    for (const r of [...tg.keys()].sort((a, b) => a - b)) { const row = tg.get(r); let sc = -1, ac = -1; for (const [c, v] of row) { if (String(v).trim() === "SCHEDULED") sc = c; if (String(v).trim() === "ACTUAL") ac = c; } if (sc > 0 && ac > 0) { hdr = { r, sc, ac }; break; } }
    if (!hdr) continue;
    const nameAt = find(tg, /^activity$/i); const nameC = nameAt ? nameAt.c : 2;
    const list = [];
    for (const r of [...tg.keys()].filter((r) => r > (nameAt ? nameAt.r : hdr.r)).sort((a, b) => a - b)) {
      const row = tg.get(r); const name = String(row.get(nameC) || "").trim(); const planned = row.get(hdr.sc - 1);
      if (name && typeof planned === "number" && planned > 0) { const done = Number(row.get(hdr.ac + 1)) || 0; list.push({ name, frac: Math.max(0, Math.min(1, Math.round((done / planned) * 10000) / 10000)) }); }
    }
    if (list.length > out.progress.length) out.progress = list;
  }
  // Photos: pictures below "3.0 PROJECT PHOTOS", in reading order; the caption is the text box just below each.
  const sheetRels = await rels(repSheet.path.replace(/([^/]+)$/, "_rels/$1.rels"));
  const drTarget = [...sheetRels.values()].find((t) => /drawings\/drawing\d+\.xml$/.test(t));
  const photosAt = find(g, /project photos/i);
  if (drTarget) {
    const drPath = resolve(repSheet.path, drTarget); const dr = await xml(drPath); const drRels = await rels(drPath.replace(/([^/]+)$/, "_rels/$1.rels"));
    const pics = [], boxes = [];
    for (const a of dr.documentElement.children) {
      if (!/Anchor$/.test(a.localName)) continue;
      const pos = (tag) => { const el = a.getElementsByTagNameNS("*", tag)[0]; return el ? { row: Number(el.getElementsByTagNameNS("*", "row")[0]?.textContent) + 1, col: Number(el.getElementsByTagNameNS("*", "col")[0]?.textContent) } : null; };
      const from = pos("from"), to = pos("to") || from; if (!from) continue;
      const blip = a.getElementsByTagNameNS("*", "blip")[0];
      if (blip) { const target = drRels.get(blip.getAttributeNS(RNS, "embed") || blip.getAttribute("r:embed")); if (target && /\.(png|jpe?g|gif|webp)$/i.test(target)) pics.push({ from, to, path: resolve(drPath, target) }); }
      else { const text = [...a.getElementsByTagNameNS("*", "p")].map((p) => [...p.getElementsByTagNameNS("*", "t")].map((t) => t.textContent).join("")).join(" ").replace(/\s+/g, " ").trim(); if (text) boxes.push({ from, text }); }
    }
    // Pictures stacked on the same spot: the last one drawn is the one on top.
    const spots = new Map(); pics.filter((ph) => !photosAt || ph.from.row > photosAt.r).forEach((ph) => spots.set(ph.from.row + ":" + ph.from.col, ph));
    const placed = [...spots.values()].sort((a, b) => (Math.abs(a.from.row - b.from.row) > 3 ? a.from.row - b.from.row : a.from.col - b.from.col));
    for (const ph of placed) {
      const box = boxes.filter((b) => b.from.row >= ph.to.row - 1 && b.from.row <= ph.to.row + 6 && Math.abs(b.from.col - ph.from.col) <= 1).sort((a, b) => a.from.row - b.from.row)[0];
      // No caption box: the caption is typed in a cell just under the photo.
      let cap = box ? box.text : "";
      for (let r = ph.to.row; !cap && r <= ph.to.row + 3; r++) { const row = g.get(r); if (!row) continue; const cs = [...row.keys()].filter((c) => c >= ph.from.col && c <= Math.max(ph.to.col, ph.from.col + 1) && typeof row.get(c) === "string" && row.get(c).trim()).sort((a, b) => a - b); if (cs.length && !/^remarks/i.test(row.get(cs[0]).trim())) cap = row.get(cs[0]).replace(/\s+/g, " ").trim(); }
      const ext = ph.path.split(".").pop().toLowerCase();
      out.photos.push({ blob: new Blob([await zip.file(ph.path).async("arraybuffer")], { type: ext === "png" ? "image/png" : ext === "gif" ? "image/gif" : ext === "webp" ? "image/webp" : "image/jpeg" }), caption: cap });
    }

}

const startingReport = new Map();
function newReport(pid, forDate) {
  const key = pid + "|" + (validDate(forDate) ? forDate : todayISO());
  if (startingReport.has(key)) return startingReport.get(key);
  const job = startReport(pid, forDate).finally(() => startingReport.delete(key));
  startingReport.set(key, job);
  return job;
}
async function startReport(pid, forDate) {
  const p = S.projects.get(pid); if (!p || !S.db) return;
  if (!p.locked) { toast("This project's schedule isn't locked yet. A manager needs to finish the setup first."); return; }
  const date = validDate(forDate) ? forDate : todayISO();
  const existing = projReports(pid, false).find((x) => x.date === date);
  if (existing) {
    if (existing.status === "draft") { openEditor(existing.id); toast("Picking up the draft for " + fmtD(date) + "."); }
    else { go("report", { rid: existing.id }); toast("Report No. " + repNo(existing.reportNo) + " for " + fmtD(date) + " is already submitted."); }
    return;
  }
  const all = projReports(pid, false);
  const prev = projReports(pid, true).filter((x) => x.date < date).pop();
  const maxNo = all.reduce((m, x) => Math.max(m, Number(x.reportNo) || 0), 0);
  const ref = S.db.collection("reports").doc();
  const progress = {}; acts(p).forEach((a) => { progress[a.id] = Number(prev?.progress?.[a.id]) || 0; });
  const body = {
    projectId: pid, reportNo: maxNo + 1, date, rev: p.rev || 0, status: "draft", progress, notes: {}, remarks: "", photos: [null, null, null, null], preparedBy: engineerOn(p, date) || "",
    scheduledPct: projSched(p, date), actualPct: projActual(p, progress),
    authorId: S.me?.id || null, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  try { await write("reports/" + ref.id, body); } catch (e) { toast(dbErr(e)); return; }
  S.reports.set(ref.id, { id: ref.id, ...body });
  openEditor(ref.id);
}
function openEditor(rid) {

async function submitReport(force) {
  const r = S.draft; const p = S.projects.get(r.projectId);
  if (!validDate(r.date)) { toast("Set the report date before submitting."); return; }
  const clash = projReports(p.id, false).find((x) => x.id !== r.id && Number(x.reportNo) === Number(r.reportNo));
  if (clash) { toast("Report No. " + repNo(r.reportNo) + " is already used. Change the report number."); $("#f-no")?.focus(); return; }
  const sameDay = projReports(p.id, true).find((x) => x.id !== r.id && x.date === r.date);

  const have = slots(r).filter(Boolean).length;

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1920, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), "image/jpeg", .85));
  } catch { return file; }
}
async function addPhoto(file, slot) {

  if (!s) return "";

  if (s.v === "report") return "report|" + s.rid;
  if (s.v === "edit" || s.v === "plan") return s.v + "|" + (s.pid || "") + "|" + (s.rid || "");
  return s.v;
}
function navRecord() {
  const cur = navCur(), k = navKey(cur);
  if (!NAV.list.length || k === navKey(NAV.list[NAV.i])) { NAV.list[NAV.i] = cur; history.replaceState({ fl: 1, i: NAV.i, s: cur }, ""); return; }
  // the in-page "← back" button went to the page we came from: step back in history instead of adding a new entry
  if (NAV.i > 0 && k === navKey(NAV.list[NAV.i - 1])) { NAV.skip = true; NAV.i--; NAV.list[NAV.i] = cur; history.back(); return; }
  NAV.list.length = NAV.i + 1; NAV.list.push(cur); NAV.i++;
  history.pushState({ fl: 1, i: NAV.i, s: cur }, "");
}
NAV.list = [navCur()]; history.replaceState({ fl: 1, i: 0, s: NAV.list[0] }, "");
window.addEventListener("popstate", async (ev) => {
  if (NAV.skip) { NAV.skip = false; return; }
  const st = ev.state; if (!st || !st.fl) return;
  const from = NAV.i, to = st.i, t = st.s || { v: "home" };
  const stay = () => { NAV.skip = true; history.go(from - to); };
  if (S.view === "plan" && S.plan && S.planSnap && JSON.stringify(S.plan) !== S.planSnap && !confirm("Leave without saving the timetable changes?")) return stay();
  if (S.view === "edit" && S.draft) { let ok = false; await leaveEditorTo(() => { ok = true; }); if (!ok) return stay(); }
  if (S.view === "plan") { S.plan = null; S.search = []; S.shift = null; }
  let v = t.v; const opts = {};
  if (v === "edit" || v === "plan") v = t.pid ? "project" : "home";   // editors can't be reopened from history
  if (v === "project" && !(S.projects && S.projects.get && S.projects.get(t.pid))) v = "home";
  if (t.pid) opts.pid = t.pid;
  if (t.rid) opts.rid = t.rid;
  NAV.i = to; NAV.list[to] = { v: v, pid: t.pid || S.pid || null, rid: t.rid || S.rid || null };
  go(v, opts);
});

/* ---------- boot ---------- */
function liveRender() { if (S.view === "home" || S.view === "project" || S.view === "report" || S.view === "holidays") render(); }
async function boot() {
  render();
  if (!window.claude?.use) { S.noDb = true; S.loaded.projects = true; render(); return; }
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map((n) => window.claude.use(n).catch(() => null)));
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
  if (user) {
    S.me = await user.me();
    S.canWrite = await user.can("data.write");
    S.isManager = await user.canEdit();
    try { const f = localStorage.getItem("pp-filter"); if (f === "mine" || f === "all") S.filter = f; } catch {}
    if (S.me) { $("#who").innerHTML = `<img src="${esc(S.me.avatarUrl)}" alt=""><span class="who-txt"><b>${esc(S.me.name || "You")}</b>${S.me.email ? `<small>${esc(S.me.email)}</small>` : ""}</span>`; $("#who").title = "Signed in as " + (S.me.email || S.me.name || "you"); }
  }
  if (!db) { S.noDb = true; S.loaded.projects = true; render(); return; }
  db.doc("settings/calendar").onSnapshot((snap) => {
    HOL.clear();
    ((snap.exists && snap.data().holidays) || []).forEach((h) => { if (validDate(h?.date)) HOL.set(h.date, String(h.name || "Public holiday")); });
    liveRender();
  }, () => {});
  db.collection("projects").onSnapshot((snap) => {
    S.projects = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.loaded.projects = true; liveRender();
  }, () => { S.loaded.projects = true; liveRender(); });
  db.collection("plans").onSnapshot((snap) => {
    S.plans = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    liveRender();
  }, () => {});
  db.collection("reports").onSnapshot((snap) => {
    S.reports = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.loaded.reports = true; liveRender();
  }, () => { S.loaded.reports = true; liveRender(); });
}
boot();
})();
</script>
